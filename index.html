<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Training Programs</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 40 40%22><rect width=%2240%22 height=%2240%22 rx=%228%22 fill=%22%2314213B%22/><line x1=%2210%22 y1=%2220%22 x2=%2230%22 y2=%2220%22 stroke=%22%23E2603A%22 stroke-width=%224%22/><rect x=%226%22 y=%2214%22 width=%226%22 height=%2212%22 fill=%22%23E2603A%22/><rect x=%2228%22 y=%2214%22 width=%226%22 height=%2212%22 fill=%22%23E2603A%22/></svg>">
<style>
  :root{
    --navy:#14213B; --navy-2:#1E2E52; --paper:#F6F3EC; --card:#FFFFFF;
    --ink:#1C1F26; --sub:#6B7280; --teal:#1F8A70; --clay:#E2603A;
    --amber:#C98A2B; --red:#B3261E; --line:#E7E2D5;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-tap-highlight-color:transparent;}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;}

  header{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:14px 16px 0 16px;}
  .headline{display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
  .headline h1{font-size:15px;text-transform:uppercase;letter-spacing:0.06em;margin:0 0 10px 0;font-weight:800;}
  .headline .streak{font-size:11px;color:#B9C4DE;letter-spacing:0.03em;}
  .backbtn{background:none;border:none;color:#B9C4DE;font-size:12px;font-weight:700;cursor:pointer;padding:0 0 10px 0;}

  .daytabs{display:flex;overflow-x:auto;gap:4px;padding-bottom:10px;scrollbar-width:none;}
  .daytabs::-webkit-scrollbar{display:none;}
  .daytab{flex:0 0 auto;padding:8px 12px;border-radius:8px 8px 0 0;font-size:12px;font-weight:700;
    color:#9AA6C4;background:transparent;border:none;cursor:pointer;white-space:nowrap;}
  .daytab .d{display:block;font-size:9px;font-weight:600;opacity:0.75;letter-spacing:0.05em;text-transform:uppercase;}
  .daytab.active{color:#fff;background:var(--paper);}
  .daytab.active .d{color:var(--sub);}

  main{max-width:640px;margin:0 auto;padding:16px 16px 120px 16px;}

  /* ---- Home grid ---- */
  .home-intro{font-size:13px;color:var(--sub);margin-bottom:14px;line-height:1.5;}
  .prog-grid{display:flex;flex-direction:column;gap:10px;}
  .prog-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;
    display:flex;align-items:center;gap:14px;cursor:pointer;text-align:left;width:100%;}
  .prog-card:active{transform:scale(0.99);}
  .prog-icon{flex:0 0 52px;width:52px;height:52px;border-radius:12px;display:flex;align-items:center;
    justify-content:center;color:#fff;}
  .prog-body h3{margin:0 0 2px 0;font-size:14.5px;font-weight:750;}
  .prog-body p{margin:0;font-size:12px;color:var(--sub);line-height:1.4;}
  .prog-tag{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:0.04em;
    color:var(--sub);margin-top:5px;display:inline-block;}
  .prog-card.locked{opacity:0.55;cursor:default;}
  .prog-card.locked .prog-icon{background:#C9C2B2 !important;}
  .chev{margin-left:auto;color:var(--line);font-size:20px;flex:0 0 auto;}

  /* ---- Focus banner / progress ---- */
  .focus-banner{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;margin-bottom:14px;display:flex;align-items:center;gap:12px;}
  .focus-banner .tag{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:0.06em;
    padding:4px 8px;border-radius:6px;color:#fff;flex:0 0 auto;}
  .focus-banner p{margin:0;font-size:13px;color:var(--sub);line-height:1.4;}

  .progress-wrap{margin-bottom:10px;}
  .progress-label{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-bottom:5px;
    text-transform:uppercase;letter-spacing:0.05em;font-weight:700;}
  .progress-track{height:6px;background:var(--line);border-radius:99px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--clay);border-radius:99px;transition:width .7s cubic-bezier(.2,.9,.3,1);position:relative;overflow:hidden;}

  .celebrate{background:#EAF6EF;border:1px solid #BFE3CC;color:#1F6B3D;border-radius:12px;
    padding:10px 14px;font-size:12.5px;font-weight:700;margin-bottom:14px;text-align:center;}
  .streak-pill{display:inline-block;font-size:11px;font-weight:800;background:var(--navy-2);color:#fff;
    padding:3px 9px;border-radius:99px;margin-bottom:12px;}

  .timer-badge{display:flex;align-items:center;gap:8px;background:var(--navy);color:#fff;border:none;
    border-radius:12px;padding:10px 14px;margin-bottom:14px;width:100%;cursor:pointer;font-family:inherit;}
  .timer-badge .tlabel{font-size:10px;text-transform:uppercase;letter-spacing:0.06em;opacity:0.7;font-weight:700;}
  .timer-badge .tval{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:18px;font-weight:700;margin-left:auto;}
  .timer-badge .ticon{font-size:14px;}

  .swap-btn{font-size:11px;font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--sub);
    padding:5px 9px;border-radius:8px;cursor:pointer;white-space:nowrap;}
  .swap-day-btn{display:block;width:100%;text-align:center;font-size:12.5px;font-weight:700;
    border:1px dashed var(--line);background:transparent;color:var(--sub);padding:10px;border-radius:10px;
    cursor:pointer;margin-bottom:14px;}
  .swapped-tag{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:0.04em;
    color:var(--clay);background:#FCEBE4;padding:2px 6px;border-radius:5px;margin-top:4px;display:inline-block;}
  .swap-option{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
    border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;font-family:inherit;}
  .swap-option b{display:block;font-size:13.5px;margin-bottom:2px;}
  .swap-option span{font-size:11.5px;color:var(--sub);}
  .swap-revert{background:var(--paper);}

  /* ---- Custom plan quiz ---- */
  .build-card{background:linear-gradient(135deg,#2E3A5C,#1B2A4A);border:1px solid var(--line);border-radius:14px;
    padding:16px;margin-bottom:14px;color:#fff;cursor:pointer;width:100%;text-align:left;}
  .build-card h3{margin:0 0 4px 0;font-size:15.5px;}
  .build-card p{margin:0;font-size:12px;color:#B9C4DE;line-height:1.4;}
  .quiz-progress{display:flex;gap:5px;margin-bottom:20px;}
  .quiz-progress .dot{flex:1;height:4px;border-radius:99px;background:var(--line);}
  .quiz-progress .dot.done{background:var(--clay);}
  .quiz-step-label{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:0.06em;
    font-weight:800;margin-bottom:6px;}
  .quiz-question{font-size:19px;font-weight:750;margin:0 0 20px 0;line-height:1.3;}
  .quiz-option{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);
    border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer;font-family:inherit;
    font-size:14px;font-weight:600;color:var(--ink);}
  .quiz-option.selected{border-color:var(--clay);background:#FCEBE4;}
  .quiz-nav{display:flex;justify-content:space-between;margin-top:10px;}
  .quiz-back{background:transparent;border:none;color:var(--sub);font-size:13px;font-weight:700;cursor:pointer;padding:10px 0;}
  .advisory-icon{font-size:40px;text-align:center;margin-bottom:10px;}

  /* ---- Nutrition page ---- */
  .nutri-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
    background:#F0F5EC;border:1px solid #CFE0BF;color:#3E5C2A;font-weight:700;font-size:13.5px;
    padding:12px;border-radius:12px;cursor:pointer;margin-bottom:20px;}
  .goal-toggle{display:flex;gap:6px;margin-bottom:16px;}
  .goal-btn{flex:1;padding:9px 4px;border-radius:9px;border:1.5px solid var(--line);background:var(--card);
    font-size:11.5px;font-weight:700;color:var(--sub);cursor:pointer;}
  .goal-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .plate{width:100%;max-width:220px;aspect-ratio:1;border-radius:50%;margin:0 auto 16px auto;position:relative;
    background:conic-gradient(#6FA86A 0deg 180deg, #E2603A 180deg 270deg, #C98A2B 270deg 360deg);}
  .plate-legend{display:flex;justify-content:center;gap:14px;font-size:11px;color:var(--sub);margin-bottom:20px;flex-wrap:wrap;}
  .plate-legend span{display:inline-flex;align-items:center;gap:5px;}
  .plate-legend i{width:9px;height:9px;border-radius:3px;display:inline-block;}
  .meal-row{display:flex;gap:10px;margin-bottom:10px;}
  .meal-row .mlabel{flex:0 0 78px;font-size:11.5px;font-weight:800;color:var(--sub);text-transform:uppercase;
    letter-spacing:0.04em;padding-top:2px;}
  .meal-row .mtext{flex:1;font-size:13px;line-height:1.5;}

  .card.card-done{cursor:pointer;opacity:0.82;align-items:center;}
  .card.card-done .content{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;}
  .done-check{width:24px;height:24px;border-radius:50%;color:#fff;font-size:13px;font-weight:800;
    display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .side-row{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap;}
  .side-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:0.05em;
    color:var(--sub);flex:0 0 34px;}

  /* ---- Full-screen completion celebration ---- */
  .celebration-overlay{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 30%, #2E2350, #0D0A18 78%);overflow:hidden;}
  .celebration-overlay.open{display:flex;}
  .confetti{position:absolute;top:-8%;width:9px;height:15px;opacity:0.95;animation:conf-fall linear infinite;}
  @keyframes conf-fall{ to{ transform:translate3d(var(--dx,0px),115vh,0) rotate(540deg); } }
  .celeb-inner{position:relative;z-index:2;text-align:center;padding:0 22px;}
  .celeb-emoji{font-size:80px;line-height:1;margin-bottom:8px;animation:celeb-bounce 0.9s ease-in-out infinite;}
  @keyframes celeb-bounce{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-16px) scale(1.06);}}
  .celeb-message{font-family:"Arial Black",Arial,sans-serif;font-size:32px;color:#fff;text-transform:uppercase;
    line-height:1.15;-webkit-text-stroke:1.4px #000;text-shadow:3px 3px 0 rgba(0,0,0,0.55);margin-bottom:10px;}
  .celeb-sub{color:#CFC8E8;font-size:13.5px;margin-bottom:22px;}
  .celeb-stats{display:flex;gap:12px;justify-content:center;margin-bottom:26px;flex-wrap:wrap;}
  .celeb-stat{background:rgba(255,255,255,0.10);border:1px solid rgba(255,255,255,0.22);border-radius:12px;
    padding:10px 18px;}
  .celeb-stat .num{font-size:19px;font-weight:800;color:#fff;font-family:ui-monospace,monospace;}
  .celeb-stat .lbl{font-size:9px;text-transform:uppercase;color:#CFC8E8;letter-spacing:0.05em;margin-top:2px;}
  .celeb-close{background:#fff;color:#14213B;border:none;padding:13px 34px;border-radius:99px;font-weight:800;
    font-size:14px;cursor:pointer;}

  .section-title{font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--sub);
    font-weight:800;margin:22px 0 8px 2px;}

  .card{background:var(--card);border-radius:14px;border:1px solid var(--line);margin-bottom:10px;
    overflow:hidden;display:flex;}
  .card .iconbox{flex:0 0 52px;width:52px;height:52px;margin:12px 0 12px 12px;border-radius:11px;
    display:flex;align-items:center;justify-content:center;background:var(--paper);border:1px solid var(--line);}
  .card .content{padding:12px 14px;flex:1;min-width:0;}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .card h3{margin:0;font-size:14.5px;font-weight:750;}
  .setsreps{font-size:11.5px;color:var(--sub);margin-top:2px;}
  .cue{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.45;}
  .spot{font-size:11.5px;color:var(--navy-2);margin-top:5px;line-height:1.4;font-weight:600;}
  .spot::before{content:"\1F4CD  ";}

  .joint{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:800;
    text-transform:uppercase;letter-spacing:0.04em;padding:2px 6px;border-radius:5px;flex:0 0 auto;}
  .joint .dot{width:7px;height:7px;border-radius:50%;display:inline-block;}
  .joint.none{color:var(--teal);background:#E7F5F1;}
  .joint.none .dot{background:var(--teal);}
  .joint.light{color:var(--amber);background:#FBF1E1;}
  .joint.light .dot{background:var(--amber);}

  .pips-row{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:10px;flex-wrap:wrap;}
  .pips{display:flex;gap:7px;}
  .pip{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:transparent;
    cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;
    color:transparent;transition:all .15s ease;-webkit-appearance:none;padding:0;}
  .pip.done{color:#fff;}

  .rest-btn{font-size:11px;font-weight:700;border:none;background:var(--navy);color:#fff;
    padding:6px 10px;border-radius:8px;cursor:pointer;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .yt-btn{width:28px;height:28px;border-radius:50%;background:#D9342B;border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;flex:0 0 auto;padding:0;}
  .rest-btn.running{background:var(--clay);}
  .hold-btn{background:var(--teal);}
  .hold-btn.running{background:var(--clay);}

  .avoid-box{background:#FBEAE8;border:1px solid #F0C4BF;border-radius:12px;padding:12px 14px;
    font-size:12.5px;line-height:1.55;color:#7A2A24;}
  .avoid-box b{color:var(--red);}

  .fab-row{position:fixed;bottom:18px;left:0;right:0;display:flex;justify-content:center;gap:8px;
    z-index:15;padding:0 16px;}
  .fab{background:var(--navy);color:#fff;border:none;padding:12px 18px;border-radius:99px;font-size:13px;
    font-weight:700;display:flex;align-items:center;gap:8px;cursor:pointer;box-shadow:0 8px 20px rgba(20,33,59,0.35);}
  .fab.learn{background:var(--clay);}

  .flash-icon{width:96px;height:96px;border-radius:20px;background:var(--paper);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;margin:6px auto 16px auto;}
  .flash-counter{text-align:center;font-size:11px;color:var(--sub);font-weight:700;text-transform:uppercase;
    letter-spacing:0.06em;margin-bottom:2px;}
  .flash-body{text-align:center;}
  .flash-body h2{margin:4px 0 2px 0;font-size:19px;}
  .flash-hint{color:var(--sub);font-size:13px;margin:8px 0 0 0;}
  .reveal-btn{display:block;margin:16px auto 0 auto;background:var(--navy);color:#fff;border:none;
    padding:11px 22px;border-radius:99px;font-size:13.5px;font-weight:700;cursor:pointer;}
  .flash-detail{margin-top:10px;}
  .flash-detail .spot,.flash-detail .cue{text-align:left;margin-top:10px;background:var(--card);
    border:1px solid var(--line);border-radius:10px;padding:10px 12px;}
  .flash-nav{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:10px;}
  .nav-btn{flex:1;background:var(--card);border:1px solid var(--line);color:var(--ink);padding:11px 0;
    border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;}

  .overlay{position:fixed;inset:0;background:rgba(20,20,25,0.5);z-index:30;display:none;
    align-items:flex-end;justify-content:center;}
  .overlay.open{display:flex;}
  .sheet{background:var(--paper);width:100%;max-width:640px;border-radius:18px 18px 0 0;
    padding:20px 20px 28px 20px;max-height:82vh;overflow-y:auto;}
  .sheet h2{margin:0 0 4px 0;font-size:17px;}
  .sheet .close{display:block;margin:0 auto;background:transparent;border:none;width:36px;height:4px;
    border-radius:99px;background:var(--line);margin-bottom:14px;}
  .sheet .meta{font-size:12px;color:var(--sub);margin-bottom:16px;}
  .rule{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;
    font-size:12.5px;margin-bottom:10px;line-height:1.5;}

  /* ---- In-app video pop-up ---- */
  .video-overlay{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
    background:rgba(8,8,16,.74);padding:12px;}
  .video-overlay.open{display:flex;}
  .video-modal{background:#0F1220;border-radius:16px;width:100%;max-width:560px;max-height:94vh;overflow:auto;
    box-shadow:0 24px 60px rgba(0,0,0,.55);}
  @media (min-width:700px){.video-modal{max-width:620px;}}
  .video-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px 10px 16px;color:#fff;}
  .video-head h3{margin:0;font-size:14px;font-weight:700;line-height:1.3;}
  .video-close{flex:0 0 auto;width:32px;height:32px;border-radius:50%;border:none;background:rgba(255,255,255,.14);
    color:#fff;font-size:16px;cursor:pointer;}
  .video-frame{position:relative;width:100%;aspect-ratio:16/9;background:#000;}
  .video-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
  .video-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#CFC8E8;font-size:13px;}
  .video-foot{display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px 14px 14px;}
  .video-foot a,.video-foot button{font-size:12px;font-weight:700;color:#fff;background:rgba(255,255,255,.14);border:none;
    padding:8px 12px;border-radius:8px;text-decoration:none;cursor:pointer;font-family:inherit;}
  .video-fallback{padding:14px 16px 6px 16px;color:#E4E0F2;font-size:13px;line-height:1.5;}
  .video-fallback details{margin-top:12px;background:rgba(255,255,255,.07);border-radius:10px;padding:10px 12px;}
  .video-fallback summary{cursor:pointer;font-weight:700;font-size:12.5px;}
  .video-fallback input{width:100%;margin:10px 0 8px 0;padding:9px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.25);
    background:rgba(0,0,0,.35);color:#fff;font-size:13px;font-family:ui-monospace,Menlo,monospace;}
  .video-fallback .vf-err{color:#FFB4A8;font-size:12px;margin-top:6px;}
  .video-fallback ol{margin:8px 0 0 0;padding-left:18px;font-size:12px;color:#BDB7D6;}

  /* ---- Motion & energy ---- */
  @keyframes rise-in{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
  @keyframes fade-in{from{opacity:0;}to{opacity:1;}}
  @keyframes pip-pop{0%{transform:scale(.55);}55%{transform:scale(1.4);}100%{transform:scale(1);}}
  @keyframes done-flash{0%{transform:scale(1.05);box-shadow:0 0 0 0 rgba(31,138,112,.6);}
    65%{box-shadow:0 0 0 16px rgba(31,138,112,0);}100%{transform:scale(1);box-shadow:0 0 0 0 rgba(31,138,112,0);}}
  @keyframes pulse-run{0%,100%{box-shadow:0 0 0 0 rgba(226,96,58,.55);}50%{box-shadow:0 0 0 8px rgba(226,96,58,0);}}
  @keyframes shimmer{to{transform:translateX(100%);}}
  @keyframes flame{0%,100%{transform:rotate(-8deg) scale(1);}50%{transform:rotate(8deg) scale(1.25);}}
  @keyframes tick-pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.3);}}
  @keyframes celeb-pop{0%{transform:scale(.3) rotate(-8deg);opacity:0;}70%{transform:scale(1.12) rotate(2deg);opacity:1;}
    100%{transform:scale(1) rotate(0);opacity:1;}}

  .anim-in{animation:rise-in .42s cubic-bezier(.2,.8,.2,1) both;}
  .pip.pop{animation:pip-pop .4s cubic-bezier(.3,1.6,.5,1);}
  .card.just-done{animation:done-flash .8s ease-out;}
  .rest-btn.running{animation:pulse-run 1s ease-out infinite;}
  .timer-badge.running .ticon{display:inline-block;animation:tick-pulse 1.2s ease-in-out infinite;}
  .streak-pill .flame{display:inline-block;animation:flame 1.1s ease-in-out infinite;}
  .progress-fill::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);animation:shimmer 1.8s ease-in-out infinite;}
  .build-card{position:relative;overflow:hidden;}
  .build-card::after{content:"";position:absolute;inset:0;transform:translateX(-100%);pointer-events:none;
    background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.14) 50%,transparent 70%);
    animation:shimmer 3.4s ease-in-out infinite;}
  .daytab{transition:color .2s,background .2s;}
  button{transition:transform .12s ease,box-shadow .2s,background .2s,opacity .2s;}
  button:not(:disabled):active{transform:scale(.94);}
  button.prog-card:active,button.build-card:active,button.quiz-option:active,button.swap-option:active{transform:scale(.98);}

  .celebration-overlay.open{animation:fade-in .25s ease-out;}
  .celeb-emoji{animation:celeb-pop .6s cubic-bezier(.2,1.6,.4,1) both,celeb-bounce .9s ease-in-out .6s infinite;}
  .celeb-message{animation:celeb-pop .55s cubic-bezier(.2,1.6,.4,1) .15s both;}
  .celeb-sub{animation:rise-in .4s ease-out .45s both;}
  .celeb-stats{animation:rise-in .4s ease-out .6s both;}
  .celeb-close{animation:rise-in .4s ease-out .8s both;}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation:none !important;transition:none !important;}
  }

  /* ---- Uplift: living header, drifting background, home hero ---- */
  @keyframes hdr-shift{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}
  @keyframes ecg-run{from{stroke-dashoffset:64;}to{stroke-dashoffset:0;}}
  @keyframes bokeh{0%,100%{transform:translate(0,0) scale(1);}33%{transform:translate(40px,-60px) scale(1.15);}66%{transform:translate(-30px,40px) scale(.9);}}
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes drift{0%,100%{transform:translateY(0) rotate(-8deg);}50%{transform:translateY(-12px) rotate(10deg);}}
  @keyframes ring-pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.65);}100%{box-shadow:0 0 0 10px rgba(255,255,255,0);}}
  @keyframes marquee{from{transform:translateX(0);}to{transform:translateX(-50%);}}
  @keyframes icon-float{0%,100%{transform:translateY(0) rotate(0);}50%{transform:translateY(-4px) rotate(-4deg);}}
  @keyframes chev-nudge{0%,100%{transform:translateX(0);}50%{transform:translateX(5px);}}
  @keyframes eq{0%,100%{height:25%;}50%{height:100%;}}
  @keyframes spark-fly{from{transform:translate(-50%,-50%) scale(1);opacity:1;}
    to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.2);opacity:0;}}
  @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
  @keyframes pulse-dot{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.6);opacity:.5;}}
  @keyframes down-bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(6px);}}

  header{background:linear-gradient(120deg,#14213B 0%,#1E2E52 35%,#2B2266 65%,#14213B 100%);
    background-size:300% 300%;animation:hdr-shift 16s ease infinite;}
  .ecg{width:46px;height:16px;flex:0 0 auto;align-self:flex-start;margin:1px auto 0 10px;overflow:visible;}
  .ecg path{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:1.8;}
  .ecg .base{stroke:rgba(255,255,255,.22);}
  .ecg .beat{stroke:#FF7A59;stroke-dasharray:24 40;animation:ecg-run 1.5s linear infinite;}

  .bg-float{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
  .bg-float i{position:absolute;border-radius:50%;filter:blur(36px);opacity:.2;will-change:transform;animation:bokeh 18s ease-in-out infinite;}
  .bg-float i:nth-child(1){width:240px;height:240px;background:#E2603A;left:-60px;top:8%;}
  .bg-float i:nth-child(2){width:300px;height:300px;background:#7C5CBF;right:-100px;top:34%;animation-duration:24s;animation-delay:-6s;}
  .bg-float i:nth-child(3){width:220px;height:220px;background:#1F8A70;left:12%;bottom:-70px;animation-duration:21s;animation-delay:-11s;}
  .bg-float i:nth-child(4){width:160px;height:160px;background:#F0A737;right:18%;top:-40px;animation-duration:26s;animation-delay:-3s;}
  main{position:relative;z-index:1;}

  .hero{position:relative;overflow:hidden;border-radius:20px;padding:18px 18px 16px;margin-bottom:14px;color:#fff;
    background:linear-gradient(135deg,#1B2A4A,#3A2C7A);box-shadow:0 14px 30px rgba(27,42,74,.28);}
  .hero-morning{background:linear-gradient(135deg,#E2603A,#C9667A 55%,#6C4BB5);}
  .hero-afternoon{background:linear-gradient(135deg,#1F8A70,#2E6F9E 60%,#3A2C7A);}
  .hero-evening{background:linear-gradient(135deg,#3A2C7A,#8A3F9E 55%,#E2603A);}
  .hero-night{background:linear-gradient(135deg,#0F1530,#1E2E52 55%,#3A2C7A);}
  .hero::before{content:"";position:absolute;inset:-60%;pointer-events:none;
    background:conic-gradient(from 0deg,rgba(255,255,255,0),rgba(255,255,255,.14) 18%,rgba(255,255,255,0) 40%);animation:spin 14s linear infinite;}
  .hero > *{position:relative;z-index:1;}
  .hero-float{position:absolute;font-size:22px;opacity:.5;pointer-events:none;animation:drift 7s ease-in-out infinite;}
  .hero-kicker{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;opacity:.85;}
  .hero-greet{margin:4px 0 14px;font-size:21px;line-height:1.15;font-family:"Arial Black",Arial,sans-serif;letter-spacing:-.02em;max-width:88%;}
  .hero-main{display:flex;align-items:center;gap:14px;}
  .ring-wrap{position:relative;width:76px;height:76px;flex:0 0 auto;}
  .ring{width:100%;height:100%;transform:rotate(-90deg);}
  .ring circle{fill:none;stroke-width:4.2;}
  .ring-bg{stroke:rgba(255,255,255,.22);}
  .ring-fg{stroke:#fff;stroke-linecap:round;stroke-dasharray:113.1;stroke-dashoffset:113.1;transition:stroke-dashoffset 1.1s cubic-bezier(.2,.9,.2,1);}
  .ring-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;font-variant-numeric:tabular-nums;}
  .hero-text{flex:1;min-width:0;}
  .hero-text b{display:block;font-size:14.5px;margin-bottom:2px;}
  .hero-text span{display:block;font-size:12px;opacity:.9;line-height:1.4;}
  .hero-btn{margin-top:9px;background:#fff;color:#1B2A4A;border:none;font-weight:800;font-size:12.5px;padding:9px 16px;border-radius:99px;cursor:pointer;}
  .hero-down{font-size:22px;margin-top:8px;animation:down-bounce 1.4s ease-in-out infinite;}
  .hero-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;}
  .hero-chip{font-size:11px;font-weight:700;background:rgba(255,255,255,.18);padding:4px 10px;border-radius:99px;}
  .hero-chip .flame{display:inline-block;animation:flame 1.1s ease-in-out infinite;}
  .week-strip{display:flex;justify-content:space-between;margin-top:14px;}
  .wk{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;font-weight:800;}
  .wk .dot{width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;font-size:11px;}
  .wk.done .dot{background:#fff;border-color:#fff;color:#1B2A4A;animation:pip-pop .5s cubic-bezier(.3,1.6,.5,1) both;}
  .wk.rest .dot{border-style:dashed;opacity:.55;}
  .wk.today .dot{border-color:#fff;animation:ring-pulse 1.6s ease-out infinite;}
  .wk.today.done .dot{animation:pip-pop .5s cubic-bezier(.3,1.6,.5,1) both,ring-pulse 1.6s ease-out .5s infinite;}

  .ticker{overflow:hidden;white-space:nowrap;margin-bottom:16px;border-radius:99px;background:var(--navy);color:#fff;padding:8px 0;}
  .ticker-track{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.14em;animation:marquee 26s linear infinite;}
  .ticker-track span{padding:0 14px;}

  .prog-card{border-left:4px solid var(--accent,var(--line));}
  .prog-icon{animation:icon-float 3.8s ease-in-out infinite;}
  .prog-grid > :nth-child(2n) .prog-icon{animation-delay:-1.3s;}
  .prog-grid > :nth-child(3n) .prog-icon{animation-delay:-2.4s;}
  .chev{animation:chev-nudge 1.8s ease-in-out infinite;}

  .eq{display:inline-flex;align-items:flex-end;gap:2px;height:14px;margin-left:8px;}
  .eq i{width:3px;height:30%;background:#fff;border-radius:2px;opacity:.85;}
  .timer-badge.running .eq i{animation:eq .9s ease-in-out infinite;}
  .eq i:nth-child(2){animation-delay:-.3s;} .eq i:nth-child(3){animation-delay:-.6s;} .eq i:nth-child(4){animation-delay:-.15s;}

  .rest-btn.running{background-image:linear-gradient(90deg,rgba(255,255,255,.32) var(--p,0%),rgba(255,255,255,0) var(--p,0%));}

  .card.card-done{overflow:visible;}
  .done-check{position:relative;}
  .spark{position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:50%;pointer-events:none;animation:spark-fly .7s ease-out forwards;}

  .daytab.today .d::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--clay);margin-left:5px;vertical-align:middle;animation:pulse-dot 1.4s ease-in-out infinite;}
  .float-emoji{display:block;font-size:34px;margin-bottom:6px;animation:bob 3s ease-in-out infinite;}
  .app-ver{font-size:10px;color:var(--sub);text-align:center;margin:14px 0 10px;letter-spacing:.04em;}
  .remote-note{font-size:11.5px;color:var(--sub);margin:-6px 2px 14px 2px;line-height:1.5;}
  .quiz-option.multi{display:flex;align-items:center;gap:12px;}
  .qbox{flex:0 0 22px;width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:flex;
    align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;background:var(--card);}
  .quiz-option.selected .qbox{background:var(--clay);border-color:var(--clay);}
  .quiz-next{display:block;width:100%;margin-top:14px;padding:14px;border:none;border-radius:12px;background:var(--navy);
    color:#fff;font-weight:800;font-size:14px;cursor:pointer;}
  .quiz-next:disabled{opacity:.4;cursor:default;}
</style>
</head>

<script>
/* =========================================================
   ICONS
   ========================================================= */
const CATS = {
  cardio: { color:'#1F8A70', label:'Cardio' },
  upper:  { color:'#14213B', label:'Upper body' },
  lower:  { color:'#E2603A', label:'Lower body' },
  core:   { color:'#1C1F26', label:'Core' },

const MOVE_ICONS = {
  arc:      `<path d="M8 26 Q20 12 32 26" fill="none"/><circle cx="14" cy="23.4" r="2" fill="currentColor" stroke="none"/><circle cx="26" cy="23.4" r="2" fill="currentColor" stroke="none"/>`,
  pedal:    `<circle cx="20" cy="20" r="10"/><circle cx="20" cy="20" r="2.2" fill="currentColor" stroke="none"/><path d="M20 20 L26 14"/>`,
  pushOut:  `<circle cx="12" cy="20" r="2.4" fill="currentColor" stroke="none"/><path d="M16 20 H28 M22 15 L28 20 L22 25"/>`,
  pullDown: `<path d="M12 10 H28"/><path d="M20 10 V26"/><path d="M15 21 L20 26 L25 21"/><circle cx="20" cy="30" r="2.4" fill="currentColor" stroke="none"/>`,
  pullIn:   `<circle cx="28" cy="20" r="2.4" fill="currentColor" stroke="none"/><path d="M24 20 H12 M18 15 L12 20 L18 25"/>`,
  pushUp:   `<path d="M20 26 V13" /><path d="M15 18 L20 13 L25 18"/><circle cx="20" cy="30" r="2.4" fill="currentColor" stroke="none"/>`,
  curl:     `<path d="M12 28 L18 18" /><path d="M18 18 Q24 10 24 8" /><path d="M20.5 9.5 L24 8 L24.5 11.5"/><circle cx="18" cy="18" r="2.2" fill="none"/>`,
  pushDown: `<path d="M20 12 V25"/><path d="M15 20 L20 25 L25 20"/><circle cx="20" cy="10" r="2.4" fill="currentColor" stroke="none"/>`,
  legPush:  `<path d="M13 30 L19 20 L27 11"/><circle cx="19" cy="20" r="2.4" fill="none"/><path d="M28 16 H34 M30.5 12.5 L34 16 L30.5 19.5"/>`,
  outDouble:`<circle cx="20" cy="20" r="2.2" fill="currentColor" stroke="none"/><path d="M17 20 H9 M12.5 16.5 L9 20 L12.5 23.5"/><path d="M23 20 H31 M27.5 16.5 L31 20 L27.5 23.5"/>`,
  legUp:    `<path d="M15 32 L21 11"/><circle cx="15" cy="32" r="2.2" fill="currentColor" stroke="none"/><path d="M18.5 17 L21 11 L24.5 15"/>`,
  legBack:  `<path d="M14 11 L19 22 L15 32"/><circle cx="19" cy="22" r="2.2" fill="none"/><path d="M10 27 Q7 24 9 20"/><path d="M7.5 23 L9 20 L11.5 22"/>`,
  hipLift:  `<path d="M9 27 H19"/><circle cx="24" cy="27" r="2.2" fill="none"/><path d="M24 24 V15"/><path d="M20.5 19 L24 15 L27.5 19"/>`,
  legKick:  `<path d="M22 12 L18 22 L27 27"/><circle cx="18" cy="22" r="2.2" fill="none"/><path d="M29 22 L27 27 L23.5 25"/>`,
  hold:     `<path d="M8 24 H30" stroke-width="3.2"/><circle cx="8" cy="24" r="2.6" fill="currentColor" stroke="none"/><path d="M24 12 A6 6 0 1 1 23.9 12" stroke-width="1.6"/><path d="M24 9 V12 L26 13" stroke-width="1.6"/>`,
  cross:    `<path d="M10 12 L18 20 M22 20 L30 28"/><circle cx="20" cy="20" r="2.2" fill="none"/><path d="M15 13 L18 12 L17 15"/><path d="M29 25 L30 28 L27 27"/>`,
  rotate:   `<path d="M11 29 Q18 12 29 12"/><path d="M25.5 9 L29 12 L25.5 15"/>`,
  hug:      `<circle cx="20" cy="20" r="2.2" fill="currentColor" stroke="none"/><path d="M8 14 Q14 20 18 20"/><path d="M12 10 L8 14 L13 17"/><path d="M32 14 Q26 20 22 20"/><path d="M28 10 L32 14 L27 17"/>`,
  hinge:    `<circle cx="18" cy="18" r="2.2" fill="none"/><path d="M14 30 L18 18 L28 12"/><path d="M22 24 V14"/><path d="M19.5 17 L22 14 L24.5 17"/>`,
  squat:    `<circle cx="20" cy="6" r="2.2" fill="currentColor" stroke="none"/><path d="M20 9 V18"/><path d="M20 18 L12 30"/><path d="M20 18 L28 30"/><path d="M31 20 V26 M28.5 23 L31 26 L33.5 23"/>`,
  balance:  `<circle cx="20" cy="8" r="2.4" fill="currentColor" stroke="none"/><path d="M20 11 V22"/><path d="M20 22 L16 32"/><path d="M20 16 L28 12"/><path d="M20 16 L14 12"/>`,
};

function iconSvg(id, size){
  const ex = EX[id];
  const cat = CATS[ex.cat];
  size = size || 30;
  return `<svg width="${size}" height="${size}" viewBox="0 0 40 40" fill="none" stroke="${cat.color}" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" color="${cat.color}">${MOVE_ICONS[ex.move]}</svg>`;
}

/* =========================================================
   EXERCISE LIBRARY (shared across programs where the same
   machine/movement applies)
   ========================================================= */
const EX = {
  // ---- Cardio (shared) ----
  elliptical: {name:'Elliptical', cat:'cardio', reps:'20\u201330 min', sets:1, cue:'Moderate pace. Zero impact, full range of motion.', move:'arc', spot:'Pedals mounted on long arms, moving feet in an oval path \u2014 no seat, you stand the whole time.'},
  bike: {name:'Stationary bike', cat:'cardio', reps:'20\u201330 min', sets:1, cue:'Moderate resistance.', move:'pedal', spot:'Seat over pedals, small console in front. Upright or recumbent \u2014 either works.'},
  treadmill_hiit: {name:'Treadmill HIIT', cat:'cardio', reps:'15 min', sets:1, cue:'Sprint pace should feel like an honest 8/10 effort by the final round.', move:'arc', spot:'Alternating intervals: 1 minute hard sprint, 1 minute walking recovery.'},
  inclinewalk: {name:'Incline treadmill walk', cat:'cardio', reps:'15 min', sets:1, cue:'No holding the handrails \u2014 that\u2019s the whole point of the incline.', move:'arc', spot:'Steady brisk walk with the treadmill incline set to 10\u201312%.'},
  stairmaster: {name:'Stairmaster / elliptical', cat:'cardio', reps:'15 min', sets:1, cue:'Stay off the handrails; keep posture tall.', move:'arc', spot:'Steady-state cardio at a pace where you can only speak in short sentences.'},
  rowing_intervals: {name:'Rowing / bike intervals', cat:'cardio', reps:'20 min', sets:1, cue:'On the rower: legs push first, then lean, then pull \u2014 reverse on the way back.', move:'pedal', spot:'High-intensity intervals: 40 seconds hard, 80 seconds easy.'},

  // ---- Upper body machines (shared) ----
  chestpress: {name:'Chest press machine', cat:'upper', reps:'10\u201312 reps', sets:3, cue:'Controlled tempo, full range, don\u2019t lock elbows out hard at the top.', move:'pushOut', spot:'Seat facing forward with two handles at chest height that push straight out together.'},
  latpull: {name:'Lat pulldown', cat:'upper', reps:'10\u201312 reps', sets:3, cue:'Pull to upper chest, squeeze shoulder blades together.', move:'pullDown', spot:'Wide bar hanging from a cable up top; thigh pads hold you down in the seat below it.'},
  seatedrow: {name:'Seated row machine', cat:'upper', reps:'10\u201312 reps', sets:3, cue:'Keep chest up, drive elbows back rather than pulling with arms.', move:'pullIn', spot:'Seat facing a chest pad, handles out in front that you pull straight back toward your ribs.'},
  shoulderpress: {name:'Shoulder press machine', cat:'upper', reps:'10\u201312 reps', sets:3, cue:'Moderate weight, core braced so lower back doesn\u2019t arch.', move:'pushUp', spot:'Seat with a back pad, handles starting around shoulder height, pressing straight overhead.'},
  bicep: {name:'Bicep curls', cat:'upper', reps:'12 reps', sets:3, cue:'Slow on the way down \u2014 that\u2019s where most of the work happens.', move:'curl', spot:'Padded arm rest angled forward, or just a dumbbell \u2014 elbow stays pinned, forearm curls up.'},
  tricep: {name:'Tricep pushdown', cat:'upper', reps:'12\u201315 reps', sets:3, cue:'Elbows pinned to your sides through the whole movement.', move:'pushDown', spot:'High cable pulley with a short bar or rope handle, pushed straight down in front of you.'},

  // ---- Lower body, knee-safe (Knee-Safe program only) ----
  legpress: {name:'Leg press \u2014 partial range', cat:'lower', reps:'12 reps', sets:3, cue:'Never past 90\u00b0 knee flexion. Slow, controlled, light-moderate weight.', joint:'light', move:'legPush', spot:'Reclined seat facing a large angled platform you push away with your feet.'},
  hipabd: {name:'Hip abductor / adductor', cat:'lower', reps:'15 reps each way', sets:3, cue:'Outer thigh/glute shaping with almost zero knee stress.', joint:'none', move:'outDouble', spot:'Seated machine with padded levers on the outside (or inside) of both thighs that push apart or together.'},
  legraise: {name:'Straight leg raises', cat:'lower', reps:'15 reps', sets:3, cue:'Leg stays straight throughout \u2014 pure quad activation, no knee bend.', joint:'none', move:'legUp', spot:'Lying on a bench or mat, or a captain\u2019s chair \u2014 the working leg never bends at the knee.'},
  hamcurl: {name:'Seated hamstring curl', cat:'lower', reps:'12 reps', sets:3, cue:'Light-moderate weight, controlled on the way back up.', joint:'light', move:'legBack', spot:'Seated machine, a padded roller rests against the back of your ankles and curls under the seat.'},
  glutebridge: {name:'Glute bridge / hip thrust', cat:'lower', reps:'15 reps', sets:3, cue:'Minimal knee involvement. Squeeze glutes at the top.', joint:'none', move:'hipLift', spot:'Upper back against a bench or pad, hips drop then drive straight up toward the ceiling.'},
  kickback: {name:'Cable kickbacks', cat:'lower', reps:'15 reps / side', sets:3, cue:'Working knee stays only slightly bent and stable.', joint:'light', move:'legKick', spot:'Low cable pulley with an ankle strap, leg kicks straight back and slightly up.'},

  // ---- Lower body, no restrictions (Over 40 / 50 / Sa7el) ----

  <div class="rule"><b>Bike intervals:</b> get the intensity from cadence, not heavy resistance, so the knee isn't grinding under load.</div>
  <div class="rule"><b>Newer knee-loading moves</b> (terminal knee extensions, shallow wall sit): keep them light, shallow and pain-free, and run them past your physio or surgeon before adding them &mdash; this list is conservative because of your tear.</div>
  <div class="avoid-box"><b>Avoid completely:</b> squats &middot; lunges &middot; full-range leg extensions (the short terminal-extension version is the exception) &middot; deep wall sits &middot; jumping / plyometrics &middot; pivoting or lateral agility drills &middot; treadmill running &middot; stair climber.</div>
`;

function spreadTrainingDays(n, total){
  const result = new Array(total).fill(false);
  for(let i=0;i<n;i++){
    const pos = Math.round(i * total / n) % total;
    result[pos] = true;
  }
  return result;
}

function pick(pool, n, exclude){
  exclude = exclude || [];
  const filtered = pool.filter(id=>!exclude.includes(id));
  return filtered.slice(0, n);
}

// Rotates the starting point through the pool each time a given day-type
// repeats, so e.g. the second "Upper" day of the week doesn't look
// identical to the first one.
function pickRotating(pool, n, offset, exclude){
  exclude = exclude || [];
  const filtered = pool.filter(id=>!exclude.includes(id));
  if(filtered.length === 0) return [];
  const result = [];
  for(let i=0; i<n && i<filtered.length; i++){
    result.push(filtered[(offset+i) % filtered.length]);
  }
  return result;
}

function buildCustomProgram(a){
  const goals = asArr(a.goal), injuries = asArr(a.injury), focuses = asArr(a.focus);
  const goalText = goals.join(' + ') || 'General fitness';
  const days = parseInt(a.days); // 2,3,4,5
  const perDayMap = {'15\u201320 min':3, '30\u201345 min':5, '45\u201360+ min':7};
  let perDay = perDayMap[a.time] || 5;
  if(a.experience === 'Beginner') perDay = Math.min(perDay, 5);

  const isKnee = injuries.includes('Knee issue');
  const noEquip = a.equipment === 'No equipment at all';
  const is50plus = a.age === '50+';
  const avoidCardio = a.cardio === 'Not a fan \u2014 minimize it';
  const loveCardio = a.cardio === 'Love it \u2014 give me more';

  // Resolve pools for this person
  let upperPool, lowerPool, corePool, cardioPool, cardioNote = null;
  if(isKnee){
    upperPool = noEquip ? POOLS.kneeUpperBw : POOLS.kneeUpper;
    lowerPool = noEquip ? POOLS.kneeLowerBw : POOLS.kneeLower;
    corePool = POOLS.kneeCore;
    cardioPool = noEquip ? [] : POOLS.kneeCardio;
    if(noEquip) cardioNote = 'No jumping-based cardio is included given your knee and no-equipment setup \u2014 stick to walking or swimming instead.';
  } else {
    upperPool = noEquip ? POOLS.bwUpper : POOLS.machineUpper;
    lowerPool = noEquip ? POOLS.bwLower : POOLS.machineLower;
    corePool = noEquip ? POOLS.bwCore : POOLS.mixedCore;
    cardioPool = noEquip ? POOLS.bwCardio : POOLS.machineCardio;
    if(is50plus){
      cardioPool = cardioPool.filter(id=>!['burpees','treadmill_hiit'].includes(id));
      if(!corePool.includes('balance_stance')) corePool = ['balance_stance', ...corePool];
    }
    if(a.experience === 'Beginner') cardioPool = cardioPool.filter(id=>id!=='burpees');
  }

  // Reorder pools by goal (compounds first for strength, otherwise leave as-is)
  if(goals.includes('Muscle & strength')){
    const priority = ['legpress_full','rdl','goblet_squat','flatbench','chestpress','latpull','seatedrow'];
    lowerPool = [...lowerPool].sort((x,y)=>{
      const rx = priority.includes(x) ? priority.indexOf(x) : 999;
      const ry = priority.includes(y) ? priority.indexOf(y) : 999;
      return rx - ry;
    });
  }

  // Decide session "type" rotation based on focus
  // One rotation per chosen focus; with several, interleave them so each gets airtime
  const ROT = {
    'Full body each time':['full'],
    'Upper body priority':['upper','lower','upper'],
    'Lower body priority':['lower','upper','lower'],
    'Core & cardio priority':['cardio','full','core'],
  };
  let lists = focuses.map(f=>ROT[f]).filter(Boolean);
  if(!lists.length) lists = [ROT['Core & cardio priority']];
  let rotation = [];
  const longest = Math.max.apply(null, lists.map(l=>l.length));
  for(let k=0; k<longest; k++) lists.forEach(l=>{ if(k < l.length) rotation.push(l[k]); });

  if(loveCardio && !rotation.includes('cardio')) rotation = [...rotation, 'cardio'];

  const trainMask = spreadTrainingDays(days, 7);
  const daysArr = [];
  let trainCount = 0;
  const typeCounters = {full:0, upper:0, lower:0, cardio:0, core:0};

  for(let i=0; i<7; i++){
    if(!trainMask[i]){
      daysArr.push({label:'Day '+(i+1), focus:'Rest', tag:'Rest', ids:[], restNote:'Rest day \u2014 recovery is part of the plan, not a day off from it.'});
      continue;
    }
    const type = rotation[trainCount % rotation.length];
    trainCount++;
    const rep = typeCounters[type] || 0;
    typeCounters[type] = rep + 1;
    const shift = Math.max(1, Math.floor(perDay/2));
    const off = rep * shift;

    let ids = [];
    let tag = '';
    let focus = '';

    if(type === 'full'){
      const nUpper = Math.ceil(perDay*0.4), nLower = Math.ceil(perDay*0.4);
      ids = [...pickRotating(upperPool, nUpper, off), ...pickRotating(lowerPool, nLower, off)];
      if(ids.length < perDay) ids.push(...pickRotating(corePool, perDay-ids.length, off, ids));
      tag = 'Full body'; focus = 'Full-body session';
    } else if(type === 'upper'){
      ids = pickRotating(upperPool, perDay-1, off);
      ids.push(...pickRotating(corePool, perDay-ids.length, off, ids));
      tag = 'Upper'; focus = 'Upper body strength';
    } else if(type === 'lower'){
      ids = pickRotating(lowerPool, perDay-1, off);
      ids.push(...pickRotating(corePool, perDay-ids.length, off, ids));
      tag = 'Lower'; focus = 'Lower body strength';
    } else if(type === 'cardio'){
      const nCardio = Math.min(perDay-1, cardioPool.length) || 0;
      ids = pickRotating(cardioPool, Math.max(nCardio,1), off);
      ids.push(...pickRotating(corePool, perDay-ids.length, off, ids));
      tag = 'Cardio'; focus = cardioPool.length ? 'Cardio + core' : 'Core (see note on cardio)';
    } else if(type === 'core'){
      ids = pickRotating(corePool, perDay, off);
      tag = 'Core'; focus = 'Core & stability';
    }

    if(!avoidCardio && type!=='cardio' && cardioPool.length && ids.length < perDay){
      ids.push(...pickRotating(cardioPool, perDay-ids.length, off, ids));
    }

    daysArr.push({label:'Day '+(i+1), focus, tag, ids: ids.slice(0,perDay)});
  }

  const rulesHtml = `
    <h2>Your plan logic</h2>
    <p class="meta">Generated from your answers \u2014 not a substitute for a coach or physical therapist.</p>
    <div class="rule"><b>Goal:</b> ${goalText} \u00b7 <b>Experience:</b> ${a.experience} \u00b7 <b>Equipment:</b> ${a.equipment}</div>
    <div class="rule"><b>Training days:</b> ${days} per week, spread across the week automatically.</div>
    ${isKnee ? `<div class="avoid-box"><b>Knee-aware:</b> only joint-safe exercises are included \u2014 no squats, lunges, or high-impact cardio.</div>` : ''}
    ${cardioNote ? `<div class="rule">${cardioNote}</div>` : ''}
    <div class="rule">Want a different plan? Retake the quiz any time from this program\u2019s home card.</div>
  `;

  return {
    title: 'Your Custom Plan',
    subtitle: `${goalText} \u00b7 ${days} days/week \u00b7 ${a.equipment}`,
    accent:'#7C5CBF', tagText:'Personalized', rulesLabel:'Plan logic', rulesHtml,
    homeIcon:`<path d="M12 3 L14.5 9.5 L21 10 L16 14.5 L17.5 21 L12 17.5 L6.5 21 L8 14.5 L3 10 L9.5 9.5 Z" fill="white"/>`,
    days: daysArr,
  };
}

/* ---- Day order (lets a rest day and a training day trade places) ---- */
function getDayOrder(pid){
  const n = PROGRAMS[pid].days.length;
  try{
    const want = String(PROGRAMS[pid].ver || 1);
    if((localStorage.getItem('wk-order-ver-'+pid) || '1') !== want){
      if(localStorage.removeItem) localStorage.removeItem('wk-order-'+pid);
      localStorage.setItem('wk-order-ver-'+pid, want);
    }
    const raw = localStorage.getItem('wk-order-'+pid);
    if(raw){
      const arr = JSON.parse(raw);
      if(Array.isArray(arr) && arr.length===n) return arr;
    }
  }catch(e){ /* ignore */ }
  return Array.from({length:n}, (_,i)=>i);
}
function saveDayOrder(pid, order){
  localStorage.setItem('wk-order-'+pid, JSON.stringify(order));
}
function dayAtPosition(pid, pos){
  const order = getDayOrder(pid);
  const src = PROGRAMS[pid].days[order[pos]];
  return Object.assign({}, src, {label: 'Day '+(pos+1)});
}
function swapDayPositions(pid, posA, posB){
  const order = getDayOrder(pid);
  const tmp = order[posA];
  order[posA] = order[posB];
  order[posB] = tmp;
  saveDayOrder(pid, order);
}

function initProgramState(pid){
  const prog = PROGRAMS[pid];
  state[pid] = {};
  for(let pos=0; pos<prog.days.length; pos++){
    const d = dayAtPosition(pid, pos);
    state[pid][d.label] = {};
    d.ids.forEach(id=>{
      state[pid][d.label][id] = makeSlotState(id);
    });
    state[pid][d.label]._swaps = {};
  }
}

function ensureDayStateInitialized(pid, positionLabel){
  const pos = posFromLabel(positionLabel);
  const d = dayAtPosition(pid, pos);
  if(!state[pid][positionLabel]) state[pid][positionLabel] = {};
  d.ids.forEach(id=>{
    if(!state[pid][positionLabel][id]){
      state[pid][positionLabel][id] = makeSlotState(id);
    }
  });
  if(!state[pid][positionLabel]._swaps) state[pid][positionLabel]._swaps = {};
}

function loadProgramState(pid){
  try{
    const raw = localStorage.getItem('wk-progress-'+pid);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed.date === new Date().toDateString()){ state[pid] = parsed.state; return; }
    }
  }catch(e){ /* ignore */ }
  initProgramState(pid);
}

function saveProgramState(pid){
  try{
    localStorage.setItem('wk-progress-'+pid, JSON.stringify({date:new Date().toDateString(), state:state[pid]}));
  }catch(e){ /* ignore */ }
}

function getStreak(pid){
  try{ return JSON.parse(localStorage.getItem('wk-streak-'+pid) || '{"count":0,"lastDate":""}'); }
  catch(e){ return {count:0,lastDate:''}; }
}
function daysSince(dateStr){
  if(!dateStr) return Infinity;
  const t = new Date(); t.setHours(0,0,0,0);
  const d = new Date(dateStr);
  if(isNaN(d.getTime())) return Infinity;
  d.setHours(0,0,0,0);
  return Math.round((t - d) / 86400000);
}
function bumpStreakIfComplete(pid, isComplete){
  if(!isComplete) return;
  const todayStr = new Date().toDateString();
  const streak = getStreak(pid);
  if(streak.lastDate === todayStr) return;
  // Rest days, optional days and sport days shouldn't break it: a gap of up to 3 days keeps it alive
  streak.count = (daysSince(streak.lastDate) <= 3) ? streak.count + 1 : 1;
  streak.lastDate = todayStr;
  localStorage.setItem('wk-streak-'+pid, JSON.stringify(streak));
}

/* ---- Whole-workout timer ---- */
function timerKey(pid, dayLabel){
  return `wk-timer-${pid}-${dayLabel}-${new Date().toDateString()}`;
}
function loadTimer(pid, dayLabel){
  try{
    const raw = localStorage.getItem(timerKey(pid, dayLabel));
    if(raw) return JSON.parse(raw);
  }catch(e){ /* ignore */ }
  return {accumulated:0, runningSince:null, manuallyPaused:false};
}
function saveTimer(pid, dayLabel, t){
  try{ localStorage.setItem(timerKey(pid, dayLabel), JSON.stringify(t)); }catch(e){ /* ignore */ }
}
function currentElapsed(t){
  return t.accumulated + (t.runningSince ? (Date.now() - t.runningSince) / 1000 : 0);
}
function formatTime(sec){
  sec = Math.floor(sec);
  const m = Math.floor(sec/60);
  const s = sec % 60;
  return `${m}:${s.toString().padStart(2,'0')}`;
}
function startWorkoutTimerIfNeeded(){
  const t = loadTimer(currentProgram, activeDay);
  if(!t.runningSince && !t.manuallyPaused){
    t.runningSince = Date.now();
    saveTimer(currentProgram, activeDay, t);
  }
}
function toggleWorkoutTimer(){
  const t = loadTimer(currentProgram, activeDay);
  if(t.runningSince){
    t.accumulated += (Date.now() - t.runningSince) / 1000;
    t.runningSince = null;
    t.manuallyPaused = true;
  } else {
    t.runningSince = Date.now();
    t.manuallyPaused = false;
  }
  saveTimer(currentProgram, activeDay, t);
  const icon = document.getElementById('workoutTimerIcon');
  if(icon) icon.textContent = t.runningSince ? '\u23F8' : '\u25B6';
  const badge = document.getElementById('workoutTimerBadge');
  if(badge) badge.classList.toggle('running', !!t.runningSince);
}
function stopTimerIfComplete(pid, dayLabel, isComplete){
  if(!isComplete) return;
  const t = loadTimer(pid, dayLabel);
  if(t.runningSince){
    t.accumulated += (Date.now() - t.runningSince) / 1000;
    t.runningSince = null;
    saveTimer(pid, dayLabel, t);
  }
}

let swapSlotId = null;
function openSwap(slotId, day){
  swapSlotId = slotId;
  const original = EX[slotId];
  // In the Knee-Safe program, never offer swaps that load the knee under flexion
  const KNEE_BLOCKED = ['dbrow','step_up','lunge','lunge_bw','squat_bw','goblet_squat','legext','wall_sit','legpress_full','rdl','burpees','jumping_jacks','high_knees','mountain_climbers','pistol_squat_progression','treadmill_hiit','stairmaster','inclinewalk'];
  const alts = (ALT_EXERCISES[slotId] || []).filter(a => currentProgram !== 'kneesafe' || !KNEE_BLOCKED.includes(a));
  const currentActive = getActiveId(day, slotId);

  let optsHtml = '';
  if(currentActive !== slotId){
    optsHtml += `<button class="swap-option swap-revert" data-pick="${slotId}"><b>\u21a9 Use original: ${original.name}</b><span>Back to today's planned exercise.</span></button>`;
  }
  alts.forEach(altId=>{
    if(altId === currentActive) return;
    const alt = EX[altId];
    optsHtml += `<button class="swap-option" data-pick="${altId}"><b>${alt.name}</b><span>${alt.spot}</span></button>`;
  });
  if(!optsHtml){ optsHtml = `<p style="font-size:12.5px;color:var(--sub);">No alternatives set up for this one yet.</p>`; }

  document.getElementById('swapTitle').textContent = `Swap: ${original.name}`;
  document.getElementById('swapOptions').innerHTML = optsHtml;
  document.querySelectorAll('#swapOptions [data-pick]').forEach(btn=>{
    btn.onclick = ()=> applySwap(slotId, btn.dataset.pick);
  });
  document.getElementById('swapOverlay').classList.add('open');
}
function applySwap(slotId, pickId){
  const daySwaps = state[currentProgram][activeDay];
  if(!daySwaps._swaps) daySwaps._swaps = {};
  if(pickId === slotId){
    delete daySwaps._swaps[slotId];
    daySwaps[slotId] = makeSlotState(slotId);
  } else {
    daySwaps._swaps[slotId] = pickId;
    daySwaps[slotId] = makeSlotState(pickId);
  }
  saveProgramState(currentProgram);
  document.getElementById('swapOverlay').classList.remove('open');
  render();
}

function getActiveId(day, id){
  const swaps = state[currentProgram][day.label]._swaps || {};
  return swaps[id] || id;
}

function computeProgress(day){
  let total=0, done=0;
  day.ids.forEach(id=>{
    const slot = state[currentProgram][day.label][id];
    if(Array.isArray(slot)){
      slot.forEach(v=>{ total++; if(v) done++; });
    } else {
      slot.left.forEach(v=>{ total++; if(v) done++; });
      slot.right.forEach(v=>{ total++; if(v) done++; });
    }
  });
  return {total, done};
}

function exerciseCard(id, day){
  const activeId = getActiveId(day, id);
  const ex = EX[activeId];
  const cat = CATS[ex.cat];
  const isSwapped = activeId !== id;
  const jointHtml = ex.joint ? `<span class="joint ${ex.joint}"><span class="dot"></span>${ex.joint==='none'?'No knee load':'Light knee load'}</span>` : '';
  const restSecs = ex.restSeconds || 60;
  const slot = state[currentProgram][day.label][id];

  function pipsFor(arr, side){
    return arr.map((v,i)=>
      `<button class="pip ${v?'done':''}${popKey === id+'|'+(side||'')+'|'+i ? ' pop' : ''}" data-ex="${id}" data-side="${side||''}" data-i="${i}" style="${v? 'background:'+cat.color+';border-color:'+cat.color+';':''}">${v?'\u2713':''}</button>`

    const sideAttr = side ? ` data-side="${side}"` : '';
    if(ex.timed) return `<button class="rest-btn hold-btn" data-hold="${id}"${sideAttr} data-duration="${ex.holdSeconds}">Start ${ex.holdSeconds}s</button>`;
    if(ex.cat!=='cardio') return `<button class="rest-btn" data-rest="${id}"${sideAttr} data-duration="${restSecs}">Rest ${restSecs}s</button>`;
    return '';
  }

  const allTrue = a => a.every(Boolean);
  const isDone = ex.perSide ? (allTrue(slot.left) && allTrue(slot.right)) : allTrue(slot);
  const cardKey = currentProgram + '|' + day.label + '|' + id;
  if(isDone && !expandedCards.has(cardKey)){

      const a = i/8*Math.PI*2, r = 34 + (i%2)*14;
      return `<i class="spark" style="--dx:${Math.round(Math.cos(a)*r)}px;--dy:${Math.round(Math.sin(a)*r)}px;background:${cat.color}"></i>`;
    }).join('') : '';

      </div>

    setsBlockHtml = `
      <div class="side-row">
        <div class="side-label">Left</div>

    <div class="iconbox">${iconSvg(activeId, 30)}</div>

        </div>
        ${jointHtml}
      </div>
      <div class="spot">${ex.spot}</div>
      <div class="cue">${ex.cue}</div>
      ${setsBlockHtml}
      <div class="pips-row" style="justify-content:flex-end;">

function attachExerciseHandlers(day){
  document.querySelectorAll('.pip').forEach(pip=>{
    pip.onclick = ()=>{
      const id = pip.dataset.ex;
      const side = pip.dataset.side || null;
      const i = parseInt(pip.dataset.i);
      const slot = state[currentProgram][activeDay][id];
      const arr = side ? slot[side] : slot;
      const wasDone = arr[i];
      arr[i] = !wasDone;
      unlockAudio();
      expandedCards.delete(currentProgram + '|' + activeDay + '|' + id);
      if(!wasDone){ setDoneFx(id, side, i, slot); }
      saveProgramState(currentProgram);

      // Creative automation: the very first set you check off each day
      // auto-starts the whole-workout timer.
      startWorkoutTimerIfNeeded();

      // Creative automation: auto-chain the rest timer the moment you
      // check off a strength set, if more sets remain on that exercise.
      const justCompleted = !wasDone;
      const activeId = getActiveId(day, id);
      const ex = EX[activeId];
      const moreLeft = arr.some(v=>!v);
      render();
      if(justCompleted && moreLeft && ex.cat!=='cardio' && !ex.timed){
        const selector = side ? `[data-rest="${id}"][data-side="${side}"]` : `[data-rest="${id}"]:not([data-side])`;
        const btn = document.querySelector(selector);
        const timerKey2 = side ? `${id}_${side}` : id;
        if(btn && !restTimers[timerKey2]) toggleRest(id, btn, side);
      }
    };
  });
  document.querySelectorAll('[data-rest]').forEach(btn=>{
    btn.onclick = ()=> toggleRest(btn.dataset.rest, btn, btn.dataset.side || null);
  });
  document.querySelectorAll('[data-hold]').forEach(btn=>{
    btn.onclick = ()=> toggleHold(btn.dataset.hold, parseInt(btn.dataset.duration), btn, btn.dataset.side || null);
  });
  document.querySelectorAll('[data-expand]').forEach(el=>{
    el.onclick = ()=>{ expandedCards.add(el.dataset.expand); render(); };
  });
  document.querySelectorAll('[data-collapse]').forEach(btn=>{
    btn.onclick = ()=>{ expandedCards.delete(btn.dataset.collapse); render(); };
  });
  document.querySelectorAll('[data-swap-slot]').forEach(btn=>{

  });
  document.querySelectorAll('[data-yt-id]').forEach(btn=>{

  });
  const timerBadge = document.getElementById('workoutTimerBadge');
  if(timerBadge){ timerBadge.onclick = toggleWorkoutTimer; }
}

/* ---- Tiny self-contained beep (no audio files, no network) ---- */
let audioCtx = null;
function unlockAudio(){
  try{
    if(!audioCtx){ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    else if(audioCtx.state === 'suspended'){ audioCtx.resume(); }
  }catch(e){ /* audio not available, fine to skip */ }
}
function playBeep(freq, duration){
  if(!audioCtx) return;
  freq = freq || 880; duration = duration || 180;
  try{
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.value = 0.22;
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration/1000);
    osc.stop(audioCtx.currentTime + duration/1000 + 0.05);
  }catch(e){ /* ignore */ }
}

function countUp(el, to){
  const reduce = typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce || typeof requestAnimationFrame !== 'function'){ el.textContent = to + '%'; return; }
  const t0 = performance.now(), dur = 900;
  const tick = (t)=>{
    const k = Math.min(1, (t - t0) / dur);
    el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3))) + '%';
    if(k < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

/* ---- Watch / earbud remote (Media Session) ----
   A near-silent looping sound makes the phone show media controls, which Samsung
   Galaxy Watch mirrors. Play/Pause starts or stops timers; the watch screen shows the countdown. */
let remoteOn = false;
let remoteAudio = null;
let remoteMsg = '';
function silentWavUrl(){
  const rate = 8000, n = rate * 10; // 10 s loop: browsers ignore very short clips for media controls
  const buf = new ArrayBuffer(44 + n*2), v = new DataView(buf);
  const w = (o, str)=>{ for(let i=0;i<str.length;i++) v.setUint8(o+i, str.charCodeAt(i)); };
  w(0,'RIFF'); v.setUint32(4, 36+n*2, true); w(8,'WAVE'); w(12,'fmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,rate,true); v.setUint32(28,rate*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
  w(36,'data'); v.setUint32(40, n*2, true);
  for(let i=0;i<n;i++) v.setInt16(44+i*2, Math.round(Math.sin(2*Math.PI*30*i/rate)*60), true); // inaudible 30 Hz hum
  return URL.createObjectURL(new Blob([buf], {type:'audio/wav'}));
}
function exName(id){
  try{
    const day = dayAtPosition(currentProgram, posFromLabel(activeDay));
    return EX[getActiveId(day, id)].name;
  }catch(e){ return EX[id] ? EX[id].name : ''; }

function remoteMeta(title, artist){
  if(!remoteOn || !('mediaSession' in navigator) || typeof MediaMetadata === 'undefined') return;
  try{ navigator.mediaSession.metadata = new MediaMetadata({title: title, artist: artist || '', album: 'Workout remote'}); }catch(e){ /* ignore */ }
}
function anyTimerRunning(){
  return Object.keys(holdTimers).length > 0 || Object.keys(restTimers).length > 0;
}
function stopAllTimers(){
  Object.keys(holdTimers).forEach(k=>{ clearInterval(holdTimers[k].interval); delete holdTimers[k]; });
  Object.keys(restTimers).forEach(k=>{ clearInterval(restTimers[k].interval); delete restTimers[k]; });
  if(screen === 'program' && currentProgram) render();
  remoteMeta('Stopped', 'Press play for the next hold');
}
// Next timed hold today: first unfinished one; single-leg moves alternate left / right
function findNextHold(){
  if(screen !== 'program' || !currentProgram) return null;
  ensureDayStateInitialized(currentProgram, activeDay);
  const day = dayAtPosition(currentProgram, posFromLabel(activeDay));
  for(const id of day.ids){
    const ex = EX[getActiveId(day, id)];
    if(!ex.timed) continue;
    const slot = state[currentProgram][activeDay][id];
    if(ex.perSide){
      const l = slot.left.filter(Boolean).length, r = slot.right.filter(Boolean).length;
      if(l >= ex.sets && r >= ex.sets) continue;
      const side = (l < ex.sets && (l <= r || r >= ex.sets)) ? 'left' : 'right';
      return {id, side, ex};
    }
    if(!slot.every(Boolean)) return {id, side:null, ex};
  }
  return null;
}
function startNextHold(){
  if(screen !== 'program'){ remoteMeta('Open today\u2019s workout first', ''); return; }
  const t = findNextHold();
  if(!t){ remoteMeta('No timed holds left today', 'Nice work \u2713'); return; }
  const sel = t.side ? `[data-hold="${t.id}"][data-side="${t.side}"]` : `[data-hold="${t.id}"]:not([data-side])`;
  const btn = document.querySelector(sel);
  if(!btn){ remoteMeta('Couldn\u2019t find the timer', 'Open the workout on your phone'); return; }
  toggleHold(t.id, t.ex.holdSeconds, btn, t.side);
}
function remoteToggle(){
  if(anyTimerRunning()) stopAllTimers(); else startNextHold();
}
function keepRemoteAlive(){
  if(!remoteOn) return;
  if(remoteAudio && remoteAudio.paused) remoteAudio.play().catch(()=>{});
  try{ navigator.mediaSession.playbackState = 'playing'; }catch(e){ /* ignore */ }
}
async function startRemote(){
  if(!('mediaSession' in navigator) || typeof MediaMetadata === 'undefined') return false;
  if(!remoteAudio){
    remoteAudio = new Audio();
    remoteAudio.src = silentWavUrl();
    remoteAudio.loop = true;
  }
  try{ await remoteAudio.play(); }catch(e){ return false; }
  remoteOn = true;
  const ms = navigator.mediaSession;
  const wrap = fn => () => { try{ fn(); }catch(e){ /* ignore */ } keepRemoteAlive(); };
  const set = (a, fn)=>{ try{ ms.setActionHandler(a, wrap(fn)); }catch(e){ /* action not supported */ } };
  set('play', remoteToggle); set('pause', remoteToggle);
  set('nexttrack', startNextHold);
  set('previoustrack', stopAllTimers); set('stop', stopAllTimers);
  try{ ms.playbackState = 'playing'; }catch(e){ /* ignore */ }
  remoteMeta('Workout remote ready', 'Play = start next hold \u00b7 Pause = stop');

}
function stopRemote(){
  remoteOn = false;

async function toggleRemote(){

function setDoneFx(id, side, i, slot){

function toggleHold(id, duration, btn, side){
  unlockAudio();
  const key = side ? `${id}_${side}` : id;
  if(holdTimers[key]){
    clearInterval(holdTimers[key].interval);
    delete holdTimers[key];
    btn.textContent = `Start ${duration}s`;
    btn.classList.remove('running');
    setFill(btn, 0);
    remoteMeta('Stopped', 'Press play for the next hold');
    return;
  }
  btn.classList.add('running');

  // 3-2-1 countdown first, so there's time to get into position
  let prep = 3;
  btn.textContent = 'Get ready: ' + prep;
  remoteMeta(exName(id), 'Get ready: ' + prep + (side ? ' \u00b7 ' + side : ''));
  holdTimers[key] = { interval: setInterval(()=>{
    prep--;
    if(prep <= 0){
      clearInterval(holdTimers[key].interval);
      playBeep(660, 140);
      startHoldCountdown(id, duration, btn, side, key);
    } else {
      btn.textContent = 'Get ready: ' + prep;
      remoteMeta(exName(id), 'Get ready: ' + prep + (side ? ' \u00b7 ' + side : ''));
      if(navigator.vibrate) navigator.vibrate(60);
    }
  }, 1000)};
}

function startHoldCountdown(id, duration, btn, side, key){
  let remaining = duration;
  btn.textContent = remaining + 's \u2715';
  setFill(btn, 0);
  remoteMeta(exName(id), duration + 's' + (side ? ' \u00b7 ' + side : ''));
  holdTimers[key] = { interval: setInterval(()=>{
    remaining--;
    if(remaining<=0){
      clearInterval(holdTimers[key].interval);
      delete holdTimers[key];
      if(navigator.vibrate) navigator.vibrate([150,80,150]);
      playBeep(880, 180);
      remoteMeta('Hold done \u2713', 'Press play for the next one');
      setTimeout(()=>playBeep(1040, 180), 150);
      const slot = state[currentProgram][activeDay][id];
      const arr = side ? slot[side] : slot;
      if(arr){
        const nextIdx = arr.findIndex(v=>!v);
        if(nextIdx !== -1){ arr[nextIdx] = true; setDoneFx(id, side, nextIdx, slot); saveProgramState(currentProgram); }
      }
      render();
    } else {
      btn.textContent = remaining + 's \u2715';
      setFill(btn, (duration - remaining) / duration * 100);
      remoteMeta(exName(id), remaining + 's' + (side ? ' \u00b7 ' + side : ''));
    }
  }, 1000)};
}

function toggleRest(id, btn, side){
  unlockAudio();
  const key = side ? `${id}_${side}` : id;
  const duration = parseInt(btn.dataset.duration) || 60;
  if(restTimers[key]){
    clearInterval(restTimers[key].interval);
    delete restTimers[key];
    btn.textContent = `Rest ${duration}s`;
    btn.classList.remove('running');
    setFill(btn, 0);
    remoteMeta('Rest stopped', '');
    return;
  }
  let remaining = duration;
  btn.textContent = remaining + 's \u2715';
  btn.classList.add('running');
  setFill(btn, 0);
  remoteMeta('Rest', duration + 's');
  restTimers[key] = { interval: setInterval(()=>{
    remaining--;
    if(remaining<=0){
      clearInterval(restTimers[key].interval);
      delete restTimers[key];
      btn.textContent = `Rest ${duration}s`;
      btn.classList.remove('running');
      setFill(btn, 0);
      if(navigator.vibrate) navigator.vibrate(200);
      playBeep(880, 200);
      remoteMeta('Rest over \u2014 go!', 'Press play for the next hold');
    } else {
      btn.textContent = remaining + 's \u2715';
      setFill(btn, (duration - remaining) / duration * 100);
      remoteMeta('Rest', remaining + 's');
    }
  }, 1000)};
}

/* =========================================================
   RENDER: QUIZ
   ========================================================= */
function renderQuiz(){
  document.getElementById('headerTitle').textContent = 'BUILD MY PLAN';
  document.getElementById('backBtn').style.display = 'block';
  document.getElementById('backBtn').onclick = exitQuiz;
  document.getElementById('dayTabs').innerHTML = '';
  document.getElementById('fabRow').style.display = 'none';

  const total = QUIZ_QUESTIONS.length;
  const q = QUIZ_QUESTIONS[quizStep];
  const app = document.getElementById('app');

  const sel = asArr(quizAnswers[q.key]);
  const isLast = quizStep === total - 1;
  const optHtml = o => {
    const on = sel.includes(o);
    return `<button class="quiz-option${on ? ' selected' : ''}${q.multi ? ' multi' : ''}" data-opt="${o}">${q.multi ? `<span class="qbox">${on ? '\u2713' : ''}</span>` : ''}<span>${o}</span></button>`;
  };
  app.innerHTML = `
    <div class="quiz-progress">
      ${QUIZ_QUESTIONS.map((_,i)=>`<div class="dot ${i<=quizStep?'done':''}"></div>`).join('')}
    </div>
    <div class="quiz-step-label">Question ${quizStep+1} of ${total}${q.multi ? ' \u00b7 pick all that apply' : ''}</div>
    <div class="quiz-question">${q.q}</div>
    ${q.opts.map(optHtml).join('')}
    ${q.multi ? `<button class="quiz-next" id="quizNext"${sel.length ? '' : ' disabled'}>${isLast ? 'Finish' : 'Next'} \u2192</button>` : ''}
    ${quizStep>0 ? `<div class="quiz-nav"><button class="quiz-back" id="quizBack">\u2190 Back</button></div>` : ''}
  `;
  app.querySelectorAll('[data-opt]').forEach(btn=>{
    btn.onclick = ()=>{
      if(q.multi){ toggleQuizOption(q, btn.dataset.opt); render(); }
      else { quizAnswers[q.key] = btn.dataset.opt; advanceQuiz(); }
    };
  });
  const nextBtn = document.getElementById('quizNext');
  if(nextBtn) nextBtn.onclick = ()=>{ if(asArr(quizAnswers[q.key]).length) advanceQuiz(); };
  if(quizStep>0){
    document.getElementById('quizBack').onclick = ()=>{ quizStep--; render(); };
  }
}

// Multi-select: toggle an option; an "exclusive" option (e.g. None) clears the others, and vice versa
function toggleQuizOption(q, opt){
  let cur = asArr(quizAnswers[q.key]);
  if(cur.includes(opt)){ cur = cur.filter(x => x !== opt); }
  else if(q.exclusive && opt === q.exclusive){ cur = [opt]; }
  else { cur = cur.filter(x => x !== q.exclusive); cur.push(opt); }
  quizAnswers[q.key] = cur;
}
function advanceQuiz(){
  if(quizStep < QUIZ_QUESTIONS.length - 1){ quizStep++; render(); }
  else { finishQuiz(); }
}

function finishQuiz(){
  saveCustomAnswers(quizAnswers);
  if(hasOtherInjury(quizAnswers)){
    screen = 'advisory';
    render();
  } else {
    PROGRAMS.custom = buildCustomProgram(quizAnswers);
    enterProgram('custom');
  }
}

function renderAdvisory(){
  document.getElementById('headerTitle').textContent = 'BUILD MY PLAN';
  document.getElementById('backBtn').style.display = 'block';
  document.getElementById('backBtn').onclick = exitQuiz;
  document.getElementById('dayTabs').innerHTML = '';
  document.getElementById('fabRow').style.display = 'none';

  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="card" style="display:block;padding:22px;">
      <div class="advisory-icon">\u{1FA7A}</div>
      <h2 style="text-align:center;margin:0 0 10px 0;">Let\u2019s be careful here</h2>
      <p style="text-align:center;color:var(--sub);font-size:13.5px;line-height:1.6;margin:0 0 16px 0;">
        You mentioned a back, shoulder, or other injury. We don\u2019t have exercises vetted specifically for that here,
        so we can\u2019t responsibly auto-generate a plan around it. Please check with a doctor or physical therapist
        before starting a new program \u2014 they can tell you what movements are safe for your specific situation.
      </p>
      <div class="avoid-box">Once you\u2019re cleared, come back and retake the quiz \u2014 select "None" or "Knee issue" if that\u2019s accurate, and we\u2019ll build your plan.</div>
    </div>
    <button class="swap-day-btn" id="backToQuizFromAdvisory" style="margin-top:14px;">\u2190 Retake the quiz</button>
    <button class="swap-day-btn" id="backHomeFromAdvisory">Back to all programs</button>
  `;
  document.getElementById('backToQuizFromAdvisory').onclick = startQuiz;
  document.getElementById('backHomeFromAdvisory').onclick = exitQuiz;
}

/* =========================================================

const NUTRI_GOALS = {

  'Build muscle': 'Eat in a small calorie surplus, with protein spread across the day. Muscle is built with training + recovery + slightly more fuel than maintenance, not by protein alone.',
};

function renderNutrition(){
  document.getElementById('headerTitle').textContent = 'NUTRITION GUIDE';
  document.getElementById('backBtn').style.display = 'block';
  document.getElementById('backBtn').onclick = ()=>{ screen='home'; render(); };
  document.getElementById('dayTabs').innerHTML = '';

  const app = document.getElementById('app');
  app.innerHTML = `
    <p class="home-intro">General nutrition principles that work alongside any of the programs \u2014 not a personalized meal plan, and not a substitute for a registered dietitian.</p>

    <div class="section-title">What's your current goal?</div>
    <div class="goal-toggle">
      ${Object.keys(NUTRI_GOALS).map(g=>`<button class="goal-btn ${g===nutriGoal?'active':''}" data-goal="${g}">${g}</button>`).join('')}

      <p style="margin:0;font-size:13px;line-height:1.55;">${NUTRI_GOALS[nutriGoal]}</p>
    </div>

    <div class="section-title">Build your plate</div>
    <div class="plate"></div>
    <div class="plate-legend">
      <span><i style="background:#6FA86A"></i>Half: vegetables & fruit</span>
      <span><i style="background:#E2603A"></i>Quarter: protein</span>
      <span><i style="background:#C98A2B"></i>Quarter: whole grains / starchy carbs</span>
    </div>

    <div class="section-title">Daily anchors</div>
    <div class="rule"><b>Protein:</b> roughly 1.6\u20132.2g per kg of bodyweight per day if you're training regularly \u2014 spread across 3\u20134 meals rather than one big serving.</div>
    <div class="rule"><b>Water:</b> aim for pale-yellow urine as a simple hydration check \u2014 more on training days or in heat.</div>
    <div class="rule"><b>Fiber:</b> vegetables, fruit, legumes, and whole grains at most meals \u2014 keeps you full and supports digestion.</div>
    <div class="rule"><b>Consistency beats perfection:</b> a plan you can follow 90% of the time beats a stricter one you abandon in 2 weeks.</div>

    <div class="section-title">A simple day, structured</div>
    <div class="meal-row"><div class="mlabel">Breakfast</div><div class="mtext">A protein source (eggs, yogurt, cottage cheese) + fruit or whole grains.</div></div>
    <div class="meal-row"><div class="mlabel">Lunch</div><div class="mtext">Lean protein + vegetables + a carb source (rice, potatoes, bread).</div></div>
    <div class="meal-row"><div class="mlabel">Dinner</div><div class="mtext">Similar structure to lunch, lighter on carbs if training was earlier in the day.</div></div>
    <div class="meal-row"><div class="mlabel">Snacks</div><div class="mtext">Fruit, nuts, yogurt, or a protein shake if you're short on protein for the day.</div></div>

    <div class="avoid-box" style="margin-top:20px;">This is general, widely-applicable guidance \u2014 not tailored to your body, labs, or any medical condition. If you have a health condition, are pregnant, or have specific dietary needs, please work with a doctor or registered dietitian for individual numbers.</div>
  `;
  app.querySelectorAll('[data-goal]').forEach(btn=>{
    btn.onclick = ()=>{ nutriGoal = btn.dataset.goal; renderNutrition(); };
  });

/* =========================================================
   MASTER RENDER
   ========================================================= */
function staggerIn(){
  const els = document.querySelectorAll('#app > *:not(.prog-grid), #app .prog-grid > *');
  els.forEach((el,i)=>{
    el.classList.add('anim-in');
    el.style.animationDelay = Math.min(i*40, 480) + 'ms';
  });
}
function render(){
  if(screen === 'quiz'){ renderQuiz(); }
  else if(screen === 'advisory'){ renderAdvisory(); }
  else if(screen === 'nutrition'){ renderNutrition(); }
  else if(screen === 'program' && currentProgram){ renderProgramView(); }
  else { renderHome(); }
  // Only animate when the view actually changes (screen / day / quiz step),
  // not on every tick, so taps stay snappy.
  const sig = screen + '|' + currentProgram + '|' + activeDay + '|' + quizStep;
  if(sig !== lastSig){ lastSig = sig; staggerIn(); }
}

/* =========================================================
   FLASHCARD "LEARN NAMES" MODE (scoped to current program)
   ========================================================= */
let flashList = [];
let flashIndex = 0;
let flashRevealed = false;

function getProgramExIds(pid){
  const seen = [];
  PROGRAMS[pid].days.forEach(d=> (d.ids||[]).forEach(id=>{ if(!seen.includes(id)) seen.push(id); }));
  return seen;
}

function renderFlash(){
  const id = flashList[flashIndex];
  const ex = EX[id];
  document.getElementById('flashCounter').textContent = `${CATS[ex.cat].label} \u00b7 ${flashIndex+1} / ${flashList.length}`;
  document.getElementById('flashIconBox').innerHTML = iconSvg(id, 52);

  const body = document.getElementById('flashBody');
  if(!flashRevealed){
    body.innerHTML = `<p class="flash-hint">What exercise is this? Icon shows the movement direction.</p>
      <button class="reveal-btn" id="revealBtn">Reveal</button>`;
    document.getElementById('revealBtn').onclick = ()=>{ flashRevealed = true; renderFlash(); };
  } else {
    body.innerHTML = `<h2>${ex.name}</h2>
      <div class="setsreps mono">${ex.sets} sets \u00d7 ${ex.reps}</div>
      <div class="flash-detail"><div class="spot">${ex.spot}</div><div class="cue">${ex.cue}</div></div>`;
  }

  document.getElementById('flashBody').insertAdjacentHTML('beforeend', `
    <div class="flash-nav">
      <button class="nav-btn" id="flashPrev">\u2190 Prev</button>
      <button class="nav-btn" id="flashNext">Next \u2192</button>
    </div>`);
  document.getElementById('flashPrev').onclick = ()=>{
    flashIndex = (flashIndex - 1 + flashList.length) % flashList.length;
    flashRevealed = false; renderFlash();
  };
  document.getElementById('flashNext').onclick = ()=>{
    flashIndex = (flashIndex + 1) % flashList.length;
    flashRevealed = false; renderFlash();
  };
}

document.getElementById('openLearn').onclick = ()=>{
  flashList = getProgramExIds(currentProgram);
  flashIndex = 0; flashRevealed = false;
  renderFlash();
  document.getElementById('learnOverlay').classList.add('open');
};
document.getElementById('closeLearn').onclick = ()=> document.getElementById('learnOverlay').classList.remove('open');
document.getElementById('learnOverlay').onclick = (e)=>{ if(e.target.id==='learnOverlay') e.currentTarget.classList.remove('open'); };

/* =========================================================
   BOOT
   ========================================================= */
document.getElementById('dateLabel').textContent = new Date().toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric'});
render();
