<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Training Programs</title>
<style>
  :root{
    --navy:#14213B; --navy-2:#1E2E52; --paper:#F6F3EC; --card:#FFFFFF;
    --ink:#1C1F26; --sub:#6B7280; --teal:#1F8A70; --clay:#E2603A;
    --amber:#C98A2B; --red:#B3261E; --line:#E7E2D5;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-tap-highlight-color:transparent;}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;}

  header{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:14px 16px 0 16px;}
  .headline{display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
  .headline h1{font-size:15px;text-transform:uppercase;letter-spacing:0.06em;margin:0 0 10px 0;font-weight:800;}
  .headline .streak{font-size:11px;color:#B9C4DE;letter-spacing:0.03em;}
  .backbtn{background:none;border:none;color:#B9C4DE;font-size:12px;font-weight:700;cursor:pointer;padding:0 0 10px 0;}

  .daytabs{display:flex;overflow-x:auto;gap:4px;padding-bottom:10px;scrollbar-width:none;}
  .daytabs::-webkit-scrollbar{display:none;}
  .daytab{flex:0 0 auto;padding:8px 12px;border-radius:8px 8px 0 0;font-size:12px;font-weight:700;
    color:#9AA6C4;background:transparent;border:none;cursor:pointer;white-space:nowrap;}
  .daytab .d{display:block;font-size:9px;font-weight:600;opacity:0.75;letter-spacing:0.05em;text-transform:uppercase;}
  .daytab.active{color:#fff;background:var(--paper);}
  .daytab.active .d{color:var(--sub);}

  main{max-width:640px;margin:0 auto;padding:16px 16px 120px 16px;}

  /* ---- Home grid ---- */
  .home-intro{font-size:13px;color:var(--sub);margin-bottom:14px;line-height:1.5;}
  .prog-grid{display:flex;flex-direction:column;gap:10px;}
  .prog-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;
    display:flex;align-items:center;gap:14px;cursor:pointer;text-align:left;width:100%;}
  .prog-card:active{transform:scale(0.99);}
  .prog-icon{flex:0 0 52px;width:52px;height:52px;border-radius:12px;display:flex;align-items:center;
    justify-content:center;color:#fff;}
  .prog-body h3{margin:0 0 2px 0;font-size:14.5px;font-weight:750;}
  .prog-body p{margin:0;font-size:12px;color:var(--sub);line-height:1.4;}
  .prog-tag{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:0.04em;
    color:var(--sub);margin-top:5px;display:inline-block;}
  .prog-card.locked{opacity:0.55;cursor:default;}
  .prog-card.locked .prog-icon{background:#C9C2B2 !important;}
  .chev{margin-left:auto;color:var(--line);font-size:20px;flex:0 0 auto;}

  /* ---- Focus banner / progress ---- */
  .focus-banner{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;margin-bottom:14px;display:flex;align-items:center;gap:12px;}
  .focus-banner .tag{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:0.06em;
    padding:4px 8px;border-radius:6px;color:#fff;flex:0 0 auto;}
  .focus-banner p{margin:0;font-size:13px;color:var(--sub);line-height:1.4;}

  .progress-wrap{margin-bottom:10px;}
  .progress-label{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-bottom:5px;
    text-transform:uppercase;letter-spacing:0.05em;font-weight:700;}
  .progress-track{height:6px;background:var(--line);border-radius:99px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--clay);border-radius:99px;transition:width .35s ease;}

  .celebrate{background:#EAF6EF;border:1px solid #BFE3CC;color:#1F6B3D;border-radius:12px;
    padding:10px 14px;font-size:12.5px;font-weight:700;margin-bottom:14px;text-align:center;}
  .streak-pill{display:inline-block;font-size:11px;font-weight:800;background:var(--navy-2);color:#fff;
    padding:3px 9px;border-radius:99px;margin-bottom:12px;}

  .timer-badge{display:flex;align-items:center;gap:8px;background:var(--navy);color:#fff;border:none;
    border-radius:12px;padding:10px 14px;margin-bottom:14px;width:100%;cursor:pointer;font-family:inherit;}
  .timer-badge .tlabel{font-size:10px;text-transform:uppercase;letter-spacing:0.06em;opacity:0.7;font-weight:700;}
  .timer-badge .tval{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:18px;font-weight:700;margin-left:auto;}
  .timer-badge .ticon{font-size:14px;}

  .swap-btn{font-size:11px;font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--sub);
    padding:5px 9px;border-radius:8px;cursor:pointer;white-space:nowrap;}
  .swap-day-btn{display:block;width:100%;text-align:center;font-size:12.5px;font-weight:700;
    border:1px dashed var(--line);background:transparent;color:var(--sub);padding:10px;border-radius:10px;
    cursor:pointer;margin-bottom:14px;}
  .swapped-tag{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:0.04em;
    color:var(--clay);background:#FCEBE4;padding:2px 6px;border-radius:5px;margin-top:4px;display:inline-block;}
  .swap-option{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
    border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;font-family:inherit;}
  .swap-option b{display:block;font-size:13.5px;margin-bottom:2px;}
  .swap-option span{font-size:11.5px;color:var(--sub);}
  .swap-revert{background:var(--paper);}

  .section-title{font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--sub);
    font-weight:800;margin:22px 0 8px 2px;}

  .card{background:var(--card);border-radius:14px;border:1px solid var(--line);margin-bottom:10px;
    overflow:hidden;display:flex;}
  .card .iconbox{flex:0 0 52px;width:52px;height:52px;margin:12px 0 12px 12px;border-radius:11px;
    display:flex;align-items:center;justify-content:center;background:var(--paper);border:1px solid var(--line);}
  .card .content{padding:12px 14px;flex:1;min-width:0;}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .card h3{margin:0;font-size:14.5px;font-weight:750;}
  .setsreps{font-size:11.5px;color:var(--sub);margin-top:2px;}
  .cue{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.45;}
  .spot{font-size:11.5px;color:var(--navy-2);margin-top:5px;line-height:1.4;font-weight:600;}
  .spot::before{content:"\1F4CD  ";}

  .joint{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:800;
    text-transform:uppercase;letter-spacing:0.04em;padding:2px 6px;border-radius:5px;flex:0 0 auto;}
  .joint .dot{width:7px;height:7px;border-radius:50%;display:inline-block;}
  .joint.none{color:var(--teal);background:#E7F5F1;}
  .joint.none .dot{background:var(--teal);}
  .joint.light{color:var(--amber);background:#FBF1E1;}
  .joint.light .dot{background:var(--amber);}

  .pips-row{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:10px;flex-wrap:wrap;}
  .pips{display:flex;gap:7px;}
  .pip{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:transparent;
    cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;
    color:transparent;transition:all .15s ease;-webkit-appearance:none;padding:0;}
  .pip.done{color:#fff;}

  .rest-btn{font-size:11px;font-weight:700;border:none;background:var(--navy);color:#fff;
    padding:6px 10px;border-radius:8px;cursor:pointer;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .rest-btn.running{background:var(--clay);}
  .hold-btn{background:var(--teal);}
  .hold-btn.running{background:var(--clay);}

  .avoid-box{background:#FBEAE8;border:1px solid #F0C4BF;border-radius:12px;padding:12px 14px;
    font-size:12.5px;line-height:1.55;color:#7A2A24;}
  .avoid-box b{color:var(--red);}

  .fab-row{position:fixed;bottom:18px;left:0;right:0;display:flex;justify-content:center;gap:8px;
    z-index:15;padding:0 16px;}
  .fab{background:var(--navy);color:#fff;border:none;padding:12px 18px;border-radius:99px;font-size:13px;
    font-weight:700;display:flex;align-items:center;gap:8px;cursor:pointer;box-shadow:0 8px 20px rgba(20,33,59,0.35);}
  .fab.learn{background:var(--clay);}

  .flash-icon{width:96px;height:96px;border-radius:20px;background:var(--paper);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;margin:6px auto 16px auto;}
  .flash-counter{text-align:center;font-size:11px;color:var(--sub);font-weight:700;text-transform:uppercase;
    letter-spacing:0.06em;margin-bottom:2px;}
  .flash-body{text-align:center;}
  .flash-body h2{margin:4px 0 2px 0;font-size:19px;}
  .flash-hint{color:var(--sub);font-size:13px;margin:8px 0 0 0;}
  .reveal-btn{display:block;margin:16px auto 0 auto;background:var(--navy);color:#fff;border:none;
    padding:11px 22px;border-radius:99px;font-size:13.5px;font-weight:700;cursor:pointer;}
  .flash-detail{margin-top:10px;}
  .flash-detail .spot,.flash-detail .cue{text-align:left;margin-top:10px;background:var(--card);
    border:1px solid var(--line);border-radius:10px;padding:10px 12px;}
  .flash-nav{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:10px;}
  .nav-btn{flex:1;background:var(--card);border:1px solid var(--line);color:var(--ink);padding:11px 0;
    border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;}

  .overlay{position:fixed;inset:0;background:rgba(20,20,25,0.5);z-index:30;display:none;
    align-items:flex-end;justify-content:center;}
  .overlay.open{display:flex;}
  .sheet{background:var(--paper);width:100%;max-width:640px;border-radius:18px 18px 0 0;
    padding:20px 20px 28px 20px;max-height:82vh;overflow-y:auto;}
  .sheet h2{margin:0 0 4px 0;font-size:17px;}
  .sheet .close{display:block;margin:0 auto;background:transparent;border:none;width:36px;height:4px;
    border-radius:99px;background:var(--line);margin-bottom:14px;}
  .sheet .meta{font-size:12px;color:var(--sub);margin-bottom:16px;}
  .rule{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;
    font-size:12.5px;margin-bottom:10px;line-height:1.5;}
</style>
</head>
<body>

<header>
  <div class="headline">
    <h1 id="headerTitle">TRAINING PROGRAMS</h1>
    <span class="streak" id="dateLabel"></span>
  </div>
  <button class="backbtn" id="backBtn" style="display:none;">&larr; All programs</button>
  <div class="daytabs" id="dayTabs"></div>
</header>

<main id="app"></main>

<div class="fab-row" id="fabRow" style="display:none;">
  <button class="fab learn" id="openLearn">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 6c4-2 8-2 8 0v14c0-2-4-2-8 0V6Z" stroke="white" stroke-width="1.8"/><path d="M20 6c-4-2-8-2-8 0v14c0-2 4-2 8 0V6Z" stroke="white" stroke-width="1.8"/></svg>
    Learn names
  </button>
  <button class="fab" id="openRules">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 2 L9 11 L13 21" stroke="white" stroke-width="2.4" fill="none"/><circle cx="9" cy="11" r="2.2" stroke="#E2603A" stroke-width="1.6" fill="#14213B"/></svg>
    <span id="rulesLabel">Rules</span>
  </button>
</div>

<div class="overlay" id="learnOverlay">
  <div class="sheet">
    <button class="close" id="closeLearn"></button>
    <div class="flash-counter" id="flashCounter"></div>
    <div class="flash-icon" id="flashIconBox"></div>
    <div class="flash-body" id="flashBody"></div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <button class="close" id="closeSheet"></button>
    <div id="rulesContent"></div>
  </div>
</div>

<div class="overlay" id="swapOverlay">
  <div class="sheet">
    <button class="close" id="closeSwap"></button>
    <h2 id="swapTitle">Swap exercise</h2>
    <p class="meta">Machine taken, or just want a change? Pick an alternative for today.</p>
    <div id="swapOptions"></div>
  </div>
</div>

<div class="overlay" id="daySwapOverlay">
  <div class="sheet">
    <button class="close" id="closeDaySwap"></button>
    <h2>Swap with which day?</h2>
    <p class="meta" id="daySwapMeta"></p>
    <div id="daySwapOptions"></div>
  </div>
</div>

<script>
/* =========================================================
   ICONS
   ========================================================= */
const CATS = {
  cardio: { color:'#1F8A70', label:'Cardio' },
  upper:  { color:'#14213B', label:'Upper body' },
  lower:  { color:'#E2603A', label:'Lower body' },
  core:   { color:'#1C1F26', label:'Core' },
};

const MOVE_ICONS = {
  arc:      `<path d="M8 26 Q20 12 32 26" fill="none"/><circle cx="14" cy="23.4" r="2" fill="currentColor" stroke="none"/><circle cx="26" cy="23.4" r="2" fill="currentColor" stroke="none"/>`,
  pedal:    `<circle cx="20" cy="20" r="10"/><circle cx="20" cy="20" r="2.2" fill="currentColor" stroke="none"/><path d="M20 20 L26 14"/>`,
  pushOut:  `<circle cx="12" cy="20" r="2.4" fill="currentColor" stroke="none"/><path d="M16 20 H28 M22 15 L28 20 L22 25"/>`,
  pullDown: `<path d="M12 10 H28"/><path d="M20 10 V26"/><path d="M15 21 L20 26 L25 21"/><circle cx="20" cy="30" r="2.4" fill="currentColor" stroke="none"/>`,
  pullIn:   `<circle cx="28" cy="20" r="2.4" fill="currentColor" stroke="none"/><path d="M24 20 H12 M18 15 L12 20 L18 25"/>`,
  pushUp:   `<path d="M20 26 V13" /><path d="M15 18 L20 13 L25 18"/><circle cx="20" cy="30" r="2.4" fill="currentColor" stroke="none"/>`,
  curl:     `<path d="M12 28 L18 18" /><path d="M18 18 Q24 10 24 8" /><path d="M20.5 9.5 L24 8 L24.5 11.5"/><circle cx="18" cy="18" r="2.2" fill="none"/>`,
  pushDown: `<path d="M20 12 V25"/><path d="M15 20 L20 25 L25 20"/><circle cx="20" cy="10" r="2.4" fill="currentColor" stroke="none"/>`,
  legPush:  `<path d="M13 30 L19 20 L27 11"/><circle cx="19" cy="20" r="2.4" fill="none"/><path d="M28 16 H34 M30.5 12.5 L34 16 L30.5 19.5"/>`,
  outDouble:`<circle cx="20" cy="20" r="2.2" fill="currentColor" stroke="none"/><path d="M17 20 H9 M12.5 16.5 L9 20 L12.5 23.5"/><path d="M23 20 H31 M27.5 16.5 L31 20 L27.5 23.5"/>`,
  legUp:    `<path d="M15 32 L21 11"/><circle cx="15" cy="32" r="2.2" fill="currentColor" stroke="none"/><path d="M18.5 17 L21 11 L24.5 15"/>`,
  legBack:  `<path d="M14 11 L19 22 L15 32"/><circle cx="19" cy="22" r="2.2" fill="none"/><path d="M10 27 Q7 24 9 20"/><path d="M7.5 23 L9 20 L11.5 22"/>`,
  hipLift:  `<path d="M9 27 H19"/><circle cx="24" cy="27" r="2.2" fill="none"/><path d="M24 24 V15"/><path d="M20.5 19 L24 15 L27.5 19"/>`,
  legKick:  `<path d="M22 12 L18 22 L27 27"/><circle cx="18" cy="22" r="2.2" fill="none"/><path d="M29 22 L27 27 L23.5 25"/>`,
  hold:     `<path d="M8 24 H30" stroke-width="3.2"/><circle cx="8" cy="24" r="2.6" fill="currentColor" stroke="none"/><path d="M24 12 A6 6 0 1 1 23.9 12" stroke-width="1.6"/><path d="M24 9 V12 L26 13" stroke-width="1.6"/>`,
  cross:    `<path d="M10 12 L18 20 M22 20 L30 28"/><circle cx="20" cy="20" r="2.2" fill="none"/><path d="M15 13 L18 12 L17 15"/><path d="M29 25 L30 28 L27 27"/>`,
  rotate:   `<path d="M11 29 Q18 12 29 12"/><path d="M25.5 9 L29 12 L25.5 15"/>`,
  hug:      `<circle cx="20" cy="20" r="2.2" fill="currentColor" stroke="none"/><path d="M8 14 Q14 20 18 20"/><path d="M12 10 L8 14 L13 17"/><path d="M32 14 Q26 20 22 20"/><path d="M28 10 L32 14 L27 17"/>`,
  hinge:    `<circle cx="18" cy="18" r="2.2" fill="none"/><path d="M14 30 L18 18 L28 12"/><path d="M22 24 V14"/><path d="M19.5 17 L22 14 L24.5 17"/>`,
  squat:    `<circle cx="20" cy="6" r="2.2" fill="currentColor" stroke="none"/><path d="M20 9 V18"/><path d="M20 18 L12 30"/><path d="M20 18 L28 30"/><path d="M31 20 V26 M28.5 23 L31 26 L33.5 23"/>`,
  balance:  `<circle cx="20" cy="8" r="2.4" fill="currentColor" stroke="none"/><path d="M20 11 V22"/><path d="M20 22 L16 32"/><path d="M20 16 L28 12"/><path d="M20 16 L14 12"/>`,
};

function iconSvg(id, size){
  const ex = EX[id];
  const cat = CATS[ex.cat];
  size = size || 30;
  return `<svg width="${size}" height="${size}" viewBox="0 0 40 40" fill="none" stroke="${cat.color}" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" color="${cat.color}">${MOVE_ICONS[ex.move]}</svg>`;
}

/* =========================================================
   EXERCISE LIBRARY (shared across programs where the same
   machine/movement applies)
   ========================================================= */
const EX = {
  // ---- Cardio (shared) ----
  elliptical: {name:'Elliptical', cat:'cardio', reps:'20\u201330 min', sets:1, cue:'Moderate pace. Zero impact, full range of motion.', move:'arc', spot:'Pedals mounted on long arms, moving feet in an oval path \u2014 no seat, you stand the whole time.'},
  bike: {name:'Stationary bike', cat:'cardio', reps:'20\u201330 min', sets:1, cue:'Moderate resistance.', move:'pedal', spot:'Seat over pedals, small console in front. Upright or recumbent \u2014 either works.'},
  treadmill_hiit: {name:'Treadmill HIIT', cat:'cardio', reps:'15 min', sets:1, cue:'Sprint pace should feel like an honest 8/10 effort by the final round.', move:'arc', spot:'Alternating intervals: 1 minute hard sprint, 1 minute walking recovery.'},
  inclinewalk: {name:'Incline treadmill walk', cat:'cardio', reps:'15 min', sets:1, cue:'No holding the handrails \u2014 that\u2019s the whole point of the incline.', move:'arc', spot:'Steady brisk walk with the treadmill incline set to 10\u201312%.'},
  stairmaster: {name:'Stairmaster / elliptical', cat:'cardio', reps:'15 min', sets:1, cue:'Stay off the handrails; keep posture tall.', move:'arc', spot:'Steady-state cardio at a pace where you can only speak in short sentences.'},
  rowing_intervals: {name:'Rowing / bike intervals', cat:'cardio', reps:'20 min', sets:1, cue:'On the rower: legs push first, then lean, then pull \u2014 reverse on the way back.', move:'pedal', spot:'High-intensity intervals: 40 seconds hard, 80 seconds easy.'},

  // ---- Upper body machines (shared) ----
  chestpress: {name:'Chest press machine', cat:'upper', reps:'10\u201312 reps', sets:3, cue:'Controlled tempo, full range, don\u2019t lock elbows out hard at the top.', move:'pushOut', spot:'Seat facing forward with two handles at chest height that push straight out together.'},
  latpull: {name:'Lat pulldown', cat:'upper', reps:'10\u201312 reps', sets:3, cue:'Pull to upper chest, squeeze shoulder blades together.', move:'pullDown', spot:'Wide bar hanging from a cable up top; thigh pads hold you down in the seat below it.'},
  seatedrow: {name:'Seated row machine', cat:'upper', reps:'10\u201312 reps', sets:3, cue:'Keep chest up, drive elbows back rather than pulling with arms.', move:'pullIn', spot:'Seat facing a chest pad, handles out in front that you pull straight back toward your ribs.'},
  shoulderpress: {name:'Shoulder press machine', cat:'upper', reps:'10\u201312 reps', sets:3, cue:'Moderate weight, core braced so lower back doesn\u2019t arch.', move:'pushUp', spot:'Seat with a back pad, handles starting around shoulder height, pressing straight overhead.'},
  bicep: {name:'Bicep curls', cat:'upper', reps:'12 reps', sets:3, cue:'Slow on the way down \u2014 that\u2019s where most of the work happens.', move:'curl', spot:'Padded arm rest angled forward, or just a dumbbell \u2014 elbow stays pinned, forearm curls up.'},
  tricep: {name:'Tricep pushdown', cat:'upper', reps:'12\u201315 reps', sets:3, cue:'Elbows pinned to your sides through the whole movement.', move:'pushDown', spot:'High cable pulley with a short bar or rope handle, pushed straight down in front of you.'},

  // ---- Lower body, knee-safe (Knee-Safe program only) ----
  legpress: {name:'Leg press \u2014 partial range', cat:'lower', reps:'12 reps', sets:3, cue:'Never past 90\u00b0 knee flexion. Slow, controlled, light-moderate weight.', joint:'light', move:'legPush', spot:'Reclined seat facing a large angled platform you push away with your feet.'},
  hipabd: {name:'Hip abductor / adductor', cat:'lower', reps:'15 reps each way', sets:3, cue:'Outer thigh/glute shaping with almost zero knee stress.', joint:'none', move:'outDouble', spot:'Seated machine with padded levers on the outside (or inside) of both thighs that push apart or together.'},
  legraise: {name:'Straight leg raises', cat:'lower', reps:'15 reps', sets:3, cue:'Leg stays straight throughout \u2014 pure quad activation, no knee bend.', joint:'none', move:'legUp', spot:'Lying on a bench or mat, or a captain\u2019s chair \u2014 the working leg never bends at the knee.'},
  hamcurl: {name:'Seated hamstring curl', cat:'lower', reps:'12 reps', sets:3, cue:'Light-moderate weight, controlled on the way back up.', joint:'light', move:'legBack', spot:'Seated machine, a padded roller rests against the back of your ankles and curls under the seat.'},
  glutebridge: {name:'Glute bridge / hip thrust', cat:'lower', reps:'15 reps', sets:3, cue:'Minimal knee involvement. Squeeze glutes at the top.', joint:'none', move:'hipLift', spot:'Upper back against a bench or pad, hips drop then drive straight up toward the ceiling.'},

/* =========================================================
   STATE
   ========================================================= */
let currentProgram = null;
let activeDay = null;
let state = {};
let restTimers = {};
let holdTimers = {};

function getRollingDayIndex(pid, total){
  const key = 'wk-start-'+pid;
  const todayStr = new Date().toDateString();
  let startStr = localStorage.getItem(key);
  if(!startStr){ localStorage.setItem(key, todayStr); startStr = todayStr; }
  const start = new Date(startStr);
  const today = new Date(todayStr);
  const diff = Math.round((today - start) / 86400000);
  return ((diff % total) + total) % total;
}

/* ---- Day order (lets a rest day and a training day trade places) ---- */
function getDayOrder(pid){
  const n = PROGRAMS[pid].days.length;
  try{
    const raw = localStorage.getItem('wk-order-'+pid);
    if(raw){
      const arr = JSON.parse(raw);
      if(Array.isArray(arr) && arr.length===n) return arr;
    }
  }catch(e){ /* ignore */ }
  return Array.from({length:n}, (_,i)=>i);
}
function saveDayOrder(pid, order){
  localStorage.setItem('wk-order-'+pid, JSON.stringify(order));
}
function dayAtPosition(pid, pos){
  const order = getDayOrder(pid);
  const src = PROGRAMS[pid].days[order[pos]];
  return Object.assign({}, src, {label: 'Day '+(pos+1)});
}
function swapDayPositions(pid, posA, posB){
  const order = getDayOrder(pid);
  const tmp = order[posA];
  order[posA] = order[posB];
  order[posB] = tmp;
  saveDayOrder(pid, order);
}
function posFromLabel(label){
  return parseInt(label.split(' ')[1], 10) - 1;
}

function initProgramState(pid){
  const prog = PROGRAMS[pid];
  state[pid] = {};
  for(let pos=0; pos<prog.days.length; pos++){
    const d = dayAtPosition(pid, pos);
    state[pid][d.label] = {};
    d.ids.forEach(id=>{
      state[pid][d.label][id] = new Array(EX[id].sets).fill(false);
    });
    state[pid][d.label]._swaps = {};
  }
}

function ensureDayStateInitialized(pid, positionLabel){
  const pos = posFromLabel(positionLabel);
  const d = dayAtPosition(pid, pos);
  if(!state[pid][positionLabel]) state[pid][positionLabel] = {};
  d.ids.forEach(id=>{
    if(!state[pid][positionLabel][id]){
      state[pid][positionLabel][id] = new Array(EX[id].sets).fill(false);
    }
  });
  if(!state[pid][positionLabel]._swaps) state[pid][positionLabel]._swaps = {};
}

function loadProgramState(pid){
  try{
    const raw = localStorage.getItem('wk-progress-'+pid);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed.date === new Date().toDateString()){ state[pid] = parsed.state; return; }
    }
  }catch(e){ /* ignore */ }
  initProgramState(pid);
}

function saveProgramState(pid){
  try{
    localStorage.setItem('wk-progress-'+pid, JSON.stringify({date:new Date().toDateString(), state:state[pid]}));
  }catch(e){ /* ignore */ }
}

function getStreak(pid){
  try{ return JSON.parse(localStorage.getItem('wk-streak-'+pid) || '{"count":0,"lastDate":""}'); }
  catch(e){ return {count:0,lastDate:''}; }
}
function bumpStreakIfComplete(pid, isComplete){
  if(!isComplete) return;
  const todayStr = new Date().toDateString();
  const streak = getStreak(pid);
  if(streak.lastDate === todayStr) return;
  const yesterday = new Date(); yesterday.setDate(yesterday.getDate()-1);
  streak.count = (streak.lastDate === yesterday.toDateString()) ? streak.count + 1 : 1;
  streak.lastDate = todayStr;
  localStorage.setItem('wk-streak-'+pid, JSON.stringify(streak));
}

/* ---- Whole-workout timer ---- */
function timerKey(pid, dayLabel){
  return `wk-timer-${pid}-${dayLabel}-${new Date().toDateString()}`;
}
function loadTimer(pid, dayLabel){
  try{
    const raw = localStorage.getItem(timerKey(pid, dayLabel));
    if(raw) return JSON.parse(raw);
  }catch(e){ /* ignore */ }
  return {accumulated:0, runningSince:null, manuallyPaused:false};
}
function saveTimer(pid, dayLabel, t){
  try{ localStorage.setItem(timerKey(pid, dayLabel), JSON.stringify(t)); }catch(e){ /* ignore */ }
}
function currentElapsed(t){
  return t.accumulated + (t.runningSince ? (Date.now() - t.runningSince) / 1000 : 0);
}
function formatTime(sec){
  sec = Math.floor(sec);
  const m = Math.floor(sec/60);
  const s = sec % 60;
  return `${m}:${s.toString().padStart(2,'0')}`;
}
function startWorkoutTimerIfNeeded(){
  const t = loadTimer(currentProgram, activeDay);
  if(!t.runningSince && !t.manuallyPaused){
    t.runningSince = Date.now();
    saveTimer(currentProgram, activeDay, t);
  }
}
function toggleWorkoutTimer(){
  const t = loadTimer(currentProgram, activeDay);
  if(t.runningSince){
    t.accumulated += (Date.now() - t.runningSince) / 1000;
    t.runningSince = null;
    t.manuallyPaused = true;
  } else {
    t.runningSince = Date.now();
    t.manuallyPaused = false;
  }
  saveTimer(currentProgram, activeDay, t);
  const icon = document.getElementById('workoutTimerIcon');
  if(icon) icon.textContent = t.runningSince ? '\u23F8' : '\u25B6';
}
function stopTimerIfComplete(pid, dayLabel, isComplete){
  if(!isComplete) return;
  const t = loadTimer(pid, dayLabel);
  if(t.runningSince){
    t.accumulated += (Date.now() - t.runningSince) / 1000;
    t.runningSince = null;
    saveTimer(pid, dayLabel, t);
  }
}
// Live-updating display tick, independent of full re-renders
setInterval(()=>{
  if(!currentProgram || !activeDay) return;
  const el = document.getElementById('workoutTimerText');
  if(!el) return;
  const t = loadTimer(currentProgram, activeDay);
  el.textContent = formatTime(currentElapsed(t));
}, 1000);

/* ---- Swap exercise panel ---- */
let swapSlotId = null;
function openSwap(slotId, day){
  swapSlotId = slotId;
  const original = EX[slotId];
  const alts = ALT_EXERCISES[slotId] || [];
  const currentActive = getActiveId(day, slotId);

  let optsHtml = '';
  if(currentActive !== slotId){
    optsHtml += `<button class="swap-option swap-revert" data-pick="${slotId}"><b>\u21a9 Use original: ${original.name}</b><span>Back to today's planned exercise.</span></button>`;
  }
  alts.forEach(altId=>{
    if(altId === currentActive) return;
    const alt = EX[altId];
    optsHtml += `<button class="swap-option" data-pick="${altId}"><b>${alt.name}</b><span>${alt.spot}</span></button>`;
  });
  if(!optsHtml){ optsHtml = `<p style="font-size:12.5px;color:var(--sub);">No alternatives set up for this one yet.</p>`; }

  document.getElementById('swapTitle').textContent = `Swap: ${original.name}`;
  document.getElementById('swapOptions').innerHTML = optsHtml;
  document.querySelectorAll('#swapOptions [data-pick]').forEach(btn=>{
    btn.onclick = ()=> applySwap(slotId, btn.dataset.pick);
  });
  document.getElementById('swapOverlay').classList.add('open');
}
function applySwap(slotId, pickId){
  const daySwaps = state[currentProgram][activeDay];
  if(!daySwaps._swaps) daySwaps._swaps = {};
  if(pickId === slotId){
    delete daySwaps._swaps[slotId];
    daySwaps[slotId] = new Array(EX[slotId].sets).fill(false);
  } else {
    daySwaps._swaps[slotId] = pickId;
    daySwaps[slotId] = new Array(EX[pickId].sets).fill(false);
  }
  saveProgramState(currentProgram);
  document.getElementById('swapOverlay').classList.remove('open');
  render();
}
document.getElementById('closeSwap').onclick = ()=> document.getElementById('swapOverlay').classList.remove('open');
document.getElementById('swapOverlay').onclick = (e)=>{ if(e.target.id==='swapOverlay') e.currentTarget.classList.remove('open'); };

/* ---- Swap whole day (e.g. trade a rest day for a training day) ---- */
function openDaySwap(posA){
  const prog = PROGRAMS[currentProgram];
  const dayA = dayAtPosition(currentProgram, posA);
  document.getElementById('daySwapMeta').textContent = `Currently ${dayA.label}: ${dayA.tag} \u2014 ${dayA.focus}`;

  let optsHtml = '';
  for(let pos=0; pos<prog.days.length; pos++){
    if(pos === posA) continue;
    const d = dayAtPosition(currentProgram, pos);
    optsHtml += `<button class="swap-option" data-pos="${pos}"><b>${d.label} \u2014 ${d.tag}</b><span>${d.focus}</span></button>`;
  }
  document.getElementById('daySwapOptions').innerHTML = optsHtml;
  document.querySelectorAll('#daySwapOptions [data-pos]').forEach(btn=>{
    btn.onclick = ()=> applyDaySwap(posA, parseInt(btn.dataset.pos));
  });
  document.getElementById('daySwapOverlay').classList.add('open');
}
function applyDaySwap(posA, posB){
  swapDayPositions(currentProgram, posA, posB);
  ensureDayStateInitialized(currentProgram, 'Day '+(posA+1));
  ensureDayStateInitialized(currentProgram, 'Day '+(posB+1));
  document.getElementById('daySwapOverlay').classList.remove('open');
  render();
}
document.getElementById('closeDaySwap').onclick = ()=> document.getElementById('daySwapOverlay').classList.remove('open');
document.getElementById('daySwapOverlay').onclick = (e)=>{ if(e.target.id==='daySwapOverlay') e.currentTarget.classList.remove('open'); };



/* =========================================================
   NAVIGATION
   ========================================================= */
function enterProgram(pid){
  const prog = PROGRAMS[pid];
  if(prog.locked) return;
  currentProgram = pid;
  loadProgramState(pid);
  const idx = getRollingDayIndex(pid, prog.days.length);
  activeDay = 'Day '+(idx+1);
  render();
}
function exitProgram(){
  currentProgram = null;
  activeDay = null;
  render();
}

   RENDER: HOME

function renderHome(){

  document.getElementById('fabRow').style.display = 'none';

/* =========================================================
   RENDER: PROGRAM VIEW
   ========================================================= */
function renderDayTabs(){
  const prog = PROGRAMS[currentProgram];
  const wrap = document.getElementById('dayTabs');
  const positions = prog.days.map((_,pos)=>dayAtPosition(currentProgram, pos));
  wrap.innerHTML = positions.map(d=>`
    <button class="daytab ${d.label===activeDay?'active':''}" data-day="${d.label}">
      <span class="d">${d.label}</span>${d.tag}
    </button>`).join('');
  wrap.querySelectorAll('[data-day]').forEach(btn=>{
    btn.onclick = ()=>{ activeDay = btn.dataset.day; render(); };
  });
}

function getActiveId(day, id){
  const swaps = state[currentProgram][day.label]._swaps || {};
  return swaps[id] || id;
}

function computeProgress(day){
  let total=0, done=0;
  day.ids.forEach(id=>{
    state[currentProgram][day.label][id].forEach(v=>{ total++; if(v) done++; });
  });
  return {total, done};
}

function exerciseCard(id, day){
  const activeId = getActiveId(day, id);
  const ex = EX[activeId];
  const cat = CATS[ex.cat];
  const isSwapped = activeId !== id;
  const jointHtml = ex.joint ? `<span class="joint ${ex.joint}"><span class="dot"></span>${ex.joint==='none'?'No knee load':'Light knee load'}</span>` : '';
  const pipsHtml = state[currentProgram][day.label][id].map((v,i)=>
    `<button class="pip ${v?'done':''}" data-ex="${id}" data-i="${i}" style="${v? 'background:'+cat.color+';border-color:'+cat.color+';':''}">${v?'\u2713':''}</button>`
  ).join('');
  const restSecs = ex.restSeconds || 60;

  return `<div class="card">
    <div class="iconbox">${iconSvg(activeId, 30)}</div>
    <div class="content">
      <div class="card-top">
        <div>
          <h3>${ex.name}</h3>
          <div class="setsreps mono">${ex.sets} sets \u00d7 ${ex.reps}</div>
          ${isSwapped ? `<span class="swapped-tag">Swapped in</span>` : ''}
        </div>
        ${jointHtml}
      </div>
      <div class="spot">${ex.spot}</div>
      <div class="cue">${ex.cue}</div>
      <div class="pips-row">
        <div class="pips">${pipsHtml}</div>
        <div style="display:flex;gap:6px;">
          ${ex.timed ? `<button class="rest-btn hold-btn" data-hold="${id}" data-duration="${ex.holdSeconds}">Start ${ex.holdSeconds}s</button>` : ''}
          ${ex.cat!=='cardio' && !ex.timed ? `<button class="rest-btn" data-rest="${id}" data-duration="${restSecs}">Rest ${restSecs}s</button>` : ''}
          <button class="swap-btn" data-swap-slot="${id}">\u21c4 Swap</button>
        </div>
      </div>
    </div>
  </div>`;
}

function renderProgramView(){
  const prog = PROGRAMS[currentProgram];
  const day = dayAtPosition(currentProgram, posFromLabel(activeDay));
  ensureDayStateInitialized(currentProgram, activeDay);

  document.getElementById('headerTitle').textContent = prog.title.toUpperCase();
  document.getElementById('backBtn').style.display = 'block';
  document.getElementById('rulesLabel').textContent = prog.rulesLabel;
  document.getElementById('fabRow').style.display = 'flex';
  renderDayTabs();

  const {total, done} = computeProgress(day);
  const isComplete = total>0 && done===total;
  bumpStreakIfComplete(currentProgram, isComplete);
  stopTimerIfComplete(currentProgram, activeDay, isComplete);
  const streak = getStreak(currentProgram);

  const app = document.getElementById('app');
  let html = '';

  if(streak.count > 1){
    html += `<div class="streak-pill">\uD83D\uDD25 ${streak.count}-day streak</div>`;
  }

  html += `<div class="focus-banner">
    <span class="tag" style="background:${day.ids.length ? CATS[EX[day.ids[0]].cat].color : '#9AA6C4'}">${day.ids.length ? day.tag : 'Rest day'}</span>
    <p>${day.focus}</p>
  </div>`;

  html += `<button class="swap-day-btn" id="swapDayBtn">\u{1F500} Swap this day with another</button>`;

  if(day.ids.length){
    const timer = loadTimer(currentProgram, activeDay);
    html += `<button class="timer-badge" id="workoutTimerBadge">
      <span class="tlabel">Workout time</span>
      <span class="ticon" id="workoutTimerIcon">${timer.runningSince ? '\u23F8' : '\u25B6'}</span>
      <span class="tval" id="workoutTimerText">${formatTime(currentElapsed(timer))}</span>
    </button>`;

    html += `<div class="progress-wrap">
      <div class="progress-label"><span>Today's sets</span><span>${done} / ${total}</span></div>
      <div class="progress-track"><div class="progress-fill" style="width:${total? (done/total*100):0}%;background:${prog.accent}"></div></div>
    </div>`;

    if(isComplete){
      const finalTime = loadTimer(currentProgram, activeDay);
      html += `<div class="celebrate">\uD83C\uDF89 Day complete! Finished in ${formatTime(currentElapsed(finalTime))}.</div>`;
    }

    let lastCat = null;
    day.ids.forEach(id=>{
      const activeId = getActiveId(day, id);
      const ex = EX[activeId];
      if(ex.cat !== lastCat){
        html += `<div class="section-title">${CATS[ex.cat].label}</div>`;
        lastCat = ex.cat;
      }
      html += exerciseCard(id, day);
    });
  } else {
    html += `<div class="card" style="display:block;padding:18px;text-align:center;">
      <div class="content" style="padding:6px;"><p style="margin:0;color:var(--sub);font-size:13px;">${day.restNote}</p></div>
    </div>`;
  }

  app.innerHTML = html;
  attachExerciseHandlers(day);
  document.getElementById('swapDayBtn').onclick = ()=> openDaySwap(posFromLabel(activeDay));
}

function attachExerciseHandlers(day){
  document.querySelectorAll('.pip').forEach(pip=>{
    pip.onclick = ()=>{
      const id = pip.dataset.ex;
      const i = parseInt(pip.dataset.i);
      const arr = state[currentProgram][activeDay][id];
      const wasDone = arr[i];
      arr[i] = !wasDone;
      saveProgramState(currentProgram);

      // Creative automation: the very first set you check off each day
      // auto-starts the whole-workout timer.
      startWorkoutTimerIfNeeded();

      // Creative automation: auto-chain the rest timer the moment you
      // check off a strength set, if more sets remain on that exercise.
      const justCompleted = !wasDone;
      const activeId = getActiveId(day, id);
      const ex = EX[activeId];
      const moreLeft = arr.some(v=>!v);
      render();
      if(justCompleted && moreLeft && ex.cat!=='cardio' && !ex.timed){
        const btn = document.querySelector(`[data-rest="${id}"]`);
        if(btn && !restTimers[id]) toggleRest(id, btn);
      }
    };
  });
  document.querySelectorAll('[data-rest]').forEach(btn=>{
    btn.onclick = ()=> toggleRest(btn.dataset.rest, btn);
  });
  document.querySelectorAll('[data-hold]').forEach(btn=>{
    btn.onclick = ()=> toggleHold(btn.dataset.hold, parseInt(btn.dataset.duration), btn);
  });
  document.querySelectorAll('[data-swap-slot]').forEach(btn=>{
    btn.onclick = ()=> openSwap(btn.dataset.swapSlot, day);
  });
  const timerBadge = document.getElementById('workoutTimerBadge');
  if(timerBadge){ timerBadge.onclick = toggleWorkoutTimer; }
}

function toggleHold(id, duration, btn){
  if(holdTimers[id]){
    clearInterval(holdTimers[id].interval);
    delete holdTimers[id];
    btn.textContent = `Start ${duration}s`;
    btn.classList.remove('running');
    return;
  }
  let remaining = duration;
  btn.textContent = remaining + 's';
  btn.classList.add('running');
  holdTimers[id] = { interval: setInterval(()=>{
    remaining--;
    if(remaining<=0){
      clearInterval(holdTimers[id].interval);
      delete holdTimers[id];
      if(navigator.vibrate) navigator.vibrate([150,80,150]);
      const arr = state[currentProgram][activeDay][id];
      if(arr){
        const nextIdx = arr.findIndex(v=>!v);
        if(nextIdx !== -1){ arr[nextIdx] = true; saveProgramState(currentProgram); }
      }
      render();
    } else {
      btn.textContent = remaining + 's';
    }
  }, 1000)};
}

function toggleRest(id, btn){
  const duration = parseInt(btn.dataset.duration) || 60;
  if(restTimers[id]){
    clearInterval(restTimers[id].interval);
    delete restTimers[id];
    btn.textContent = `Rest ${duration}s`;
    btn.classList.remove('running');
    return;
  }
  let remaining = duration;
  btn.textContent = remaining + 's';
  btn.classList.add('running');
  restTimers[id] = { interval: setInterval(()=>{
    remaining--;
    if(remaining<=0){
      clearInterval(restTimers[id].interval);
      delete restTimers[id];
      btn.textContent = `Rest ${duration}s`;
      btn.classList.remove('running');
      if(navigator.vibrate) navigator.vibrate(200);
    } else {
      btn.textContent = remaining + 's';
    }
  }, 1000)};
}

/* =========================================================
   FLASHCARD "LEARN NAMES" MODE (scoped to current program)
   ========================================================= */
let flashList = [];
let flashIndex = 0;
let flashRevealed = false;

function getProgramExIds(pid){
  const seen = [];
  PROGRAMS[pid].days.forEach(d=> (d.ids||[]).forEach(id=>{ if(!seen.includes(id)) seen.push(id); }));
  return seen;
}

function renderFlash(){
  const id = flashList[flashIndex];
  const ex = EX[id];
  document.getElementById('flashCounter').textContent = `${CATS[ex.cat].label} \u00b7 ${flashIndex+1} / ${flashList.length}`;
  document.getElementById('flashIconBox').innerHTML = iconSvg(id, 52);

  const body = document.getElementById('flashBody');
  if(!flashRevealed){
    body.innerHTML = `<p class="flash-hint">What exercise is this? Icon shows the movement direction.</p>
      <button class="reveal-btn" id="revealBtn">Reveal</button>`;
    document.getElementById('revealBtn').onclick = ()=>{ flashRevealed = true; renderFlash(); };
  } else {
    body.innerHTML = `<h2>${ex.name}</h2>
      <div class="setsreps mono">${ex.sets} sets \u00d7 ${ex.reps}</div>
      <div class="flash-detail"><div class="spot">${ex.spot}</div><div class="cue">${ex.cue}</div></div>`;
  }

  document.getElementById('flashBody').insertAdjacentHTML('beforeend', `
    <div class="flash-nav">
      <button class="nav-btn" id="flashPrev">\u2190 Prev</button>
      <button class="nav-btn" id="flashNext">Next \u2192</button>
    </div>`);
  document.getElementById('flashPrev').onclick = ()=>{
    flashIndex = (flashIndex - 1 + flashList.length) % flashList.length;
    flashRevealed = false; renderFlash();
  };
  document.getElementById('flashNext').onclick = ()=>{
    flashIndex = (flashIndex + 1) % flashList.length;
    flashRevealed = false; renderFlash();
  };
}

document.getElementById('openLearn').onclick = ()=>{
  flashList = getProgramExIds(currentProgram);
  flashIndex = 0; flashRevealed = false;
  renderFlash();
  document.getElementById('learnOverlay').classList.add('open');
};
document.getElementById('closeLearn').onclick = ()=> document.getElementById('learnOverlay').classList.remove('open');
document.getElementById('learnOverlay').onclick = (e)=>{ if(e.target.id==='learnOverlay') e.currentTarget.classList.remove('open'); };

/* =========================================================
   BOOT
   ========================================================= */
document.getElementById('dateLabel').textContent = new Date().toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric'});
render();
</script>
</body>
</html>
